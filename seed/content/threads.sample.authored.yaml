- id: T06
  category: B
  topic: B2_epa608
  type: tip
  trade: hvac
  author: DayOneMistakes
  title: "EPA 608: what my students get wrong every year"
  body: |
    Every fall somebody in my class assumes the 608 is a formality. Here's what actually trips people up, in order.

    First, they skip the Core section because it "isn't technical." Core is where people fail. It's rules, dates, recovery requirements, and it's all memorization.

    Second, they cram the night before. You need to know the rules, not just recognize answers.

    Third, they don't ask how their specific test is given. The format depends on which type and who's proctoring it, so ask the testing organization before you show up.

    Go for Universal if you can. Ask me how I know you'll want it later.
  replies:
    - author: ExRetail_NowHVAC
      body: "Starting my first HVAC job next month (came from retail, 35). Boss said get the 608 before I start. Is Universal realistic for someone with zero background or should I do Type II first?"
    - author: DayOneMistakes
      accepted: true
      body: "Realistic if you study. Plenty of my 17-year-olds pass it. Do the practice tests until Core is boring."
    - author: SoJersey_HVAC_Lead
      body: "So this one time in AC... I had a guy on my crew who failed Core three times because he kept saying it was common sense lol. It isn't. Study the dates."
    - author: WalkInCoolerWes
      body: "universal. dont overthink it, just dont skip core"
    - author: dahvacnj
      body: "Type 1 I did open book online back in school, the rest was proctored. At least that's how mine was, ask whoever's giving yours"

