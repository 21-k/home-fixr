- id: T14
  category: D
  topic: D3_going_out_on_own
  type: tip
  trade: hvac
  author: MiddlesexHeatPumps
  title: "Before you go out on your own: what nobody tells you about year one"
  body: |
    I get asked about this every week, so here's my list from 25 years, the last 14 running my own company:
    - Get your license first. Registering as a home improvement contractor is not the same as holding a trade license, and it doesn't let you do licensed work.
    - Insurance will cost more than you think, and you need it before your first job, not after.
    - Price for callbacks. If you don't, every callback comes out of your pocket.
    - Your first truck doesn't need to be new. It needs to start every morning in January.
    - Keep your books from day one, or pay someone who will.
    - Most new owners undercharge for the first two years. I did.

    Ask questions below, I'll answer what I can.
  replies:
    - author: PrevailingWageMech
      body: "I'd add: decide early whether you want public work. Prevailing-wage jobs mean certified payroll every week and a lot of paperwork. Good money, different business."
    - author: SecondGenPlumber
      body: "And if you're taking over a family shop instead of starting one, it's all the same plus your father second-guessing every price you quote. Ask me how that's going."
    - author: CondensateOverflow
      body: "question on the first one, so if i register as a home improvement contractor i still can't do hvac work on my own? thought that was the whole point"
    - author: MiddlesexHeatPumps
      body: |
        Short answer as I understand it:
        - Home improvement registration is for general home improvement work
        - HVACR work needs the HVACR license (or working under someone who has it)
        - Check with Consumer Affairs for your situation; don't take a contractor's word for legal stuff, including mine
    - author: leadfree98
      body: "saving this. 'start every morning in January' is going on the wall"

# ======================== E. Technical "dumb questions" =====================
- id: T15
  category: E
  topic: E1_sweat_vs_press
  type: question
  trade: plumbing
  author: Exit117Plumber
  title: "Why did my sweat joint leak? Should I just learn press?"
  body: "Vo-tech senior, helping my uncle on weekends. Sweated a 3/4 tee on Saturday, cleaned it, fluxed it, looked perfect. Turned the water on and it dripped. Redid it and it dripped again. Uncle says just buy a press tool and stop wasting solder lol. Is sweating even worth learning anymore?"
  replies:
    - author: BergenBoilerMan
      accepted: true
      body: |
        Learn to sweat, kid. Press is great and I own the tools, but you'll be on jobs where you can't press, and you need to know why joints fail.

        Nine out of ten times a joint that looks perfect and drips has water in the line. Water in the pipe pulls the heat away and the solder never flows all the way in. Was there a valve or a low spot near that tee?
    - author: SecondGenPlumber
      body: "Agree with BergenBoilerMan. And heat the fitting, not the solder. When the solder gets pulled in on its own, you're there."
    - author: MultifamilyMaster
      body: "What size torch tip and how long were you heating it? 3/4 takes more than people think, especially next to a valve body."
    - author: FluxOnMyBoots
      body: "guy in my night class showed us the white bread trick for water in the line. felt dumb, works"
    - author: Exit117Plumber
      body: "There was a valve about a foot away that was weeping a little. So yeah, probably water."
    - author: BergenBoilerMan
      body: "There's your water. Fix the valve or get the water out first, then sweat it. You'll never forget this one."

