- id: T11
  category: C
  topic: C3_first_no_heat_winter
  type: question
  trade: hvac
  author: DinerCoffeeHVAC
  title: "On call this winter for the first time. Lots of old steam in Bayonne. Tips?"
  body: "Shop is putting me on the on-call rotation this winter. Two years in, mostly forced air so far. Half our customers in Bayonne and JC have old one-pipe steam and I've only been on maybe five steam calls with my lead. What should I check first on a no-heat steam call so I don't look lost at 2am?"
  replies:
    - author: BergenBoilerMan
      accepted: true
      body: |
        Steam's simpler than people make it, kid, but it'll punish you for rushing.

        Look at the sight glass first. Low water is the most common no-heat I see on old steam. If the glass is empty and the boiler's been firing, do NOT feed cold water into it hot. Shut it down, let it cool, then figure out why it's low. Then check the low-water cutoff, the pressuretrol, and whether the burner's even trying.

        And call your lead. Nobody expects a 2-year guy to know everything on steam at 2am. That's the job.
    - author: DayOneMistakes
      body: "Second thing my students forget: the house usually has a story. Ask the homeowner when it stopped, whether anyone added water, whether it's been banging. Two questions save you an hour."
    - author: SoJersey_HVAC_Lead
      body: "So this one time in AC... ok not AC, Pennsauken, first no-heat call on my own I spent 40 minutes on the burner and the switch at the top of the basement stairs was off lol. Check the switch."
    - author: HeatwaveOnCall
      body: "saving this thread. i'm on call for the first time this winter too, clifton"

# ============================ D. Pay & business =============================
- id: T12
  category: D
  topic: D1_second_year_pay
  type: question
  trade: plumbing
  author: benplumb79
  title: "What should a 2nd-year non-union plumber make in Central Jersey?"
  body: |
    Two years in at a non-union shop near Manville. Service and some remodel work. I'm at $21/hr, no overtime most weeks, I drive my own car to jobs. A guy I went to school with says I'm getting robbed, another says that's normal.

    Not trying to start a fight, just want to know if I should ask for a raise and what's reasonable to ask for.
  replies:
    - author: MiddlesexHeatPumps
      body: |
        Rates swing a lot by shop and trade, so look at the whole package, not just the hourly:
        - Do they pay for school or your license prep?
        - Overtime: how often, and is it paid at time and a half?
        - Mileage or a van: you driving your own car is a real cost
        - Health insurance, PTO, tools

        $21 with your own car and no benefits is on the low side for 2 years in, from what I see around here. Ask for a review, come with what you've learned to do on your own.
    - author: Woodbridge.ducts
      body: "my buddy is 2nd year and makes $40/hr. you're getting robbed"
    - author: PrevailingWageMech
      body: |
        Careful with numbers like that. A 2nd-year non-union helper at $40 an hour in Central Jersey isn't typical. Either your buddy's in the union and you're hearing the total package, or he's on a prevailing-wage job, or it's a story. Comparing a cash rate to a union package isn't apples to apples.
    - author: ForemanFromMorris
      body: "He's right. The union side publishes its wage and benefit package, so look that up on the local's site if you want a real comparison, and remember the benefits are a big piece of the number."
    - author: CondensateOverflow
      body: "3rd year hvac non-union in bound brook, i make a little more than you but i have a van. the van matters more than people think"
    - author: benplumb79
      body: "Thanks. Going to ask for a review next month and bring up mileage. Will report back."

