- id: T17
  category: E
  topic: E2_three_way_switch
  type: question
  trade: electrical
  author: RainDayRestock
  title: "3-way switches are breaking my brain"
  body: "First month as a helper in Brick. Boss had me watch him wire a pair of 3-ways in a hallway and I nodded like I got it. I didn't. Which wire goes on the dark screw and why are there two travelers? Is there a simple way to think about it?"
  replies:
    - author: DownTheShoreSparks
      accepted: true
      body: |
        Honestly everybody's brain breaks on 3-ways once. Think of it like this: the common (dark screw) on one switch is where power comes in, the common on the other switch is where it goes out to the light. The two travelers just run between the two switches, and flipping either switch picks which traveler is live.

        Draw it on a piece of cardboard on the job. Seriously.
    - author: PassedRoughIn
      body: "And test, don't guess. Turn the breaker off, verify it's dead with a tester before you touch anything, then check your work with the power back on."
    - author: JerseyTomatoWires
      body: "drew it on a 2x4 my first year... still have the 2x4"

