  author: epa60812_2
  title: "superheat vs subcool, when do i use which"
  body: "helper at a residential hvac shop in paterson, started this summer. my lead checks superheat on some systems and subcool on others and when i ask why he says 'it depends.' depends on what?? trying to actually understand it not just memorize"
  replies:
    - author: SoJersey_HVAC_Lead
      accepted: true
      body: "Depends on the metering device... fixed orifice/piston, you're looking at superheat. TXV or EEV, you're looking at subcool. Your lead isn't being difficult, it really does depend lol. Look at what's on the indoor coil."
    - author: WalkInCoolerWes
      body: "and before any of that check airflow. dirty filter, dirty coil, blower speed. charge it with bad airflow and youre chasing ghosts"
    - author: MiddlesexHeatPumps
      body: |
        Both right. Two things I'd add:
        - Use the manufacturer's charging chart or label when there is one; it beats rules of thumb
        - Write down what you measured every time, so you learn what normal looks like
    - author: epa60812_2
      body: "ok that actually makes sense. going to look at the coil on every job now"

