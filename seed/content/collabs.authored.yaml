# ---------------------------------------------------------------------------
# ~20 job collabs posted by seeded Seniors, with 2-4 pitches each from seeded
# Juniors (plan §4 "Collabs / ride-alongs"). Written by hand from the persona
# voice blocks. Fictional people and jobs; town level only, never an address.
#
# gen_collabs.py validates this file (poster/applicant exist, trade + region
# match, joined before posting/applying, exactly one accepted pitch, voice
# rules, skills from the app's list), fills the application-detail fields from
# each applicant's persona, adds timestamps, and writes content/collabs.json.
#
#   posted:      the day the Senior posted it (time of day is generated)
#   county:      the job's county (QA checks it's in the poster's region and
#                every applicant's region)
#   status:      accepted | declined | interested (= still pending)
#   skills/tools/transport: what the applicant ticked on the form
# ---------------------------------------------------------------------------
