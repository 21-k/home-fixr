# brief B148
- id: T139
  category: D
  topic: D2_side_work
  type: question
  trade: electrical
  when: late
  fact_risk: ["permit requirements apply to licensed contractors too", "workers' comp coverage for off-book work"]
  author: RainDayRestock
  title: "Boss wants me on his Saturday cash jobs. Is that the same as side work?"
  body: "Sorry if this is a dumb question. I'm a first-year helper at a small shop in Brick. My boss has started asking me to come out Saturdays on 'his' jobs, which as far as I can tell are jobs that don't go through the company. Cash, no paperwork, and he tells the customer not to worry about a permit. It's $150 for the day, which is a lot for me right now. He's licensed, so is it fine because it's under him? Or is this the thing everyone warns about?"
  replies:
    - author: codebook_dale
      accepted: true
      body: |
        Not legal advice, just how I'd look at it: his license doesn't make skipping the permit fine. A licensed contractor is still supposed to pull permits where they're required, and a job done off the company's books probably isn't on the company's insurance either.

        If you get hurt on a Saturday that officially didn't happen, workers' comp becomes a hard conversation. I'd say no politely. "I've got something on Saturdays" is enough.
    - author: thiago_sparks
      body: "Honestly I've seen this go bad both ways. Somebody gets hurt, or the house sells and the buyer's inspection turns up work with no permit, and suddenly everyone remembers who was there. $150 is real money at year one, I get it. Still not worth it."
    - author: auelecny
      body: "In the Army we'd say off the books means off the record, and nobody covers you off the record. I'd pass, brother."
    - author: ThreeWayConfusion
      body: "Ocean County is small. You think the inspectors don't know whose truck that is? Say no and keep the job. How long have you been there?"
    - author: RainDayRestock
      body: "About 4 months. Ok. Told him I have a family thing on Saturdays for now. He didn't seem mad. Thanks for explaining instead of just yelling at me lol"

