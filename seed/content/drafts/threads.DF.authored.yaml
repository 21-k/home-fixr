# brief B031
- id: T159
  category: F
  topic: F4_yelled_at_by_gc
  type: discussion
  trade: plumbing
  when: late
  author: benplumb79
  title: "Got screamed at by a GC in front of the whole crew. Wasn't even my mistake"
  body: "Sorry, venting a little. We're doing the plumbing on a kitchen and two baths in a gut reno in Hillsborough. The GC walked in this morning, saw the island drain wasn't where the new cabinet layout had it, and screamed at me in front of the tile guys and the electricians. I'm the helper. My lead set it from the drawings we were given last month. The GC changed the layout and never told us. I just stood there. Should I have said something? I didn't want to make it worse for my boss."
  replies:
    - author: mbell_wireman
      accepted: true
      body: "You did fine by not arguing on the spot. Tell your lead exactly what happened, today, and let him handle it with the GC. That's his job, not yours. Next time there's a revised drawing, ask to see the date on it. Paper settles most of these. Keep your head down and stay safe."
    - author: rui_t_kearny
      body: "My father used to say the GC yells at whoever's standing closest. It wasn't about you. I've been the guy who yelled, early on, and I regret it. The good ones come back and apologize. This one might not."
    - author: Dev_H
      body: "had the same thing happen in deptford over a vent. my lead backed me up. did yours?"
    - author: benplumb79
      body: "edit: my lead called the GC, showed him the old drawing, and the GC came back after lunch and said \"my bad\" to my lead. Not to me. But I'll take it."

