# brief B123 (re-topiced: duplicate NYC-commute brief -> rain rant, NJ)
- id: T172
  category: F
  topic: F9_weather_rant
  type: discussion
  trade: plumbing
  when: late
  author: plumbnj77
  title: "Rain rant: nine days of mud on an underground job in Jackson"
  body: "Not a question, I just need to yell. New construction in Jackson, we're supposed to be setting underground for six houses. It has rained nine of the last eleven days. The trench is soup. The GC wants it done by Friday anyway. My boots weigh ten pounds each and I've lost a glove in the mud every single day. How do you guys keep your stuff dry? Does anyone own boots that actually survive this, brother?"
  replies:
    - author: tnguyen_refrig
      body: "rotate two pairs of boots. one dries by the heater overnight while you destroy the other one. thats the whole secret"
    - author: RainDayRestock
      body: "My handle is literally about this. On rain days my boss sends us to restock the van. Underground guys don't get that luxury I guess."
    - author: oldsteam_zig
      body: "Kid, mud's part of it. Rubber boots over your work boots on trench days, and a bucket with a lid for your tools. And don't let the GC rush you into a bad joint because of a deadline. The inspector won't care that it rained. That's the job."
    - author: JunctionBoxJunkie
      body: "Electrical vo-tech kid here. I thought the attic in July was the worst thing in the trades. This sounds worse."
    - author: plumbnj77
      body: "attic in july is worse for like 2 months. mud is worse the rest of the year. both suck brother"
    - author: ThreeWayConfusion
      body: "I'm in Jackson too and it's been miserable. Our new-construction job got pushed a week because nobody could get trucks down the access road."
    - author: hec_does_ac
      body: "Lol we once did a rooftop changeout in a nor'easter because the crane was already paid for... nobody should do that. Stay dry out there"

