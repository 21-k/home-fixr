# brief B163 (re-topiced: duplicate pork roll brief -> apprentice milestone)
- id: T176
  category: F
  topic: F11_small_wins_culture
  type: discussion
  trade: electrical
  author: JerseyTomatoWires
  title: "A first-year asked ME how to bend an offset today..."
  body: "4th year in 164... today a brand new first-year on our job asked me how to bend an offset and I just showed him without thinking about it. Then I realized I was him three years ago, asking the same thing and wasting half a stick of EMT. My foreman saw it and said \"see, you're useful now.\" Weird feeling... anyway, I top out next year. Just wanted to say it somewhere"
  replies:
    - author: mbell_wireman
      body: "That's the moment. Teaching someone is how you find out you actually know it. Keep doing it, and teach him the safety part along with the bend. Stay safe."
    - author: codebook_dale
      body: "Good. The apprentices who teach well usually make the best journeymen. Teach him why, not just how. 'Because that's how we do it' is how bad habits travel from crew to crew."
    - author: TwistAndTape
      body: "2nd year 164 here, still the one asking lol. i hope somebody on my job is this nice"
    - author: JerseyTomatoWires
      body: "appreciate it... and yeah, the safety part, I made him put his glasses on first. learned that one from my foreman too"

