# brief B121
- id: T171
  category: F
  topic: F4_yelled_at_by_gc
  type: question
  trade: hvac
  author: DinerCoffeeHVAC
  title: "GC's super ripped into me on a JC jobsite. This time I deserved it"
  body: "Doing a ductless install in an apartment renovation in Jersey City. I left a ceiling access open and a bag of insulation in the hallway overnight. Fire inspector walked through first thing in the morning. The GC's super found me at 7am and let me have it in front of the drywall guys. He was right. I was embarrassed. Apologized, cleaned it up. Sorry if this is a dumb post, I'm just stewing on it. How do you get over getting yelled at when it actually was your fault?"
  replies:
    - author: ms_almonte
      accepted: true
      body: |
        First: you owned it and fixed it. That's most of it.

        Second: tomorrow, be the first one cleaning up at the end of the day, without being asked, where he can see it.

        Third: let it go by the weekend. Every one of us has a story like this. Ask me how I know.
    - author: mbell_wireman
      body: "Open ceilings and material in an egress path are a real problem on a multifamily job, so he wasn't wrong to be upset. Take the lesson, ignore the tone. Do an end-of-day walk every day: access panels closed, path clear. Stay safe."
    - author: Passaic_Sparky
      body: "idk, getting yelled at when you were wrong is alot easier than when you weren't. at least you know what to fix"
    - author: DinerCoffeeHVAC
      body: "fair. did the end of day walk today. super nodded at me on the way out. that's probably as good as it gets"

