# brief B136 (re-cast and re-topiced: duplicate pork roll brief -> tipping culture)
- id: T174
  category: F
  topic: F11_small_wins_culture
  type: question
  trade: plumbing
  when: late
  author: leadfree98
  title: "Homeowner tried to hand me a $20 tip. Do you take it?"
  body: "First month as a helper at a shop near Long Branch. We fixed a leak under an older lady's kitchen sink today, and while we were packing up she tried to hand me a $20 and a bottle of water. I took the water and said no to the money because idk what the rule is. My lead laughed at me in the truck. Is it ok to take tips? Does the shop care? Do you split it with your lead?"
  replies:
    - author: thiago_sparks
      accepted: true
      body: "Honestly, at my shop the rule is simple: if a customer insists, say thank you and take it, and never ask or hint. Some shops have a no-tip policy, so ask your boss once and then you know. Splitting with your lead is a nice move when he did most of the work, which in month one, he probably did."
    - author: oldsteam_zig
      body: "Take the water every time, kid. Take the money if she insists twice. Never take it from someone who looks like they can't afford it. That's the job."
    - author: Exit117Plumber
      body: "my foreman says a tip means the customer liked you, it's not a payment. he gives it to whoever did the cleanup. no idea if that's a thing everywhere"
    - author: hec_does_ac
      body: "Down here in summer it's cold Gatorade and leftover hoagies... I've been tipped in tomatoes from a guy's garden. Took the tomatoes lol"
    - author: leadfree98
      body: "ok asked my boss. he said keep it if they insist, nothing over $20, and buy the lead a coffee. so now i owe my lead a coffee for a tip i didn't even take lol"

