# new D thread (Senior business-side post)
- id: T153
  category: D
  topic: D5_shop_economics
  type: tip
  trade: hvac
  when: late
  fact_risk: ["service call fee ($189) and tech wage ($22/hr) are one shop's", "paid drive time for employees"]
  author: Kash_sing
  title: "Where the money from a $189 service call actually goes"
  body: |
    Every year a new tech sees an invoice and asks why he makes $22 an hour when we charged $189 for forty minutes. Fair question. Here's roughly how I explain it at my shop. Numbers differ everywhere; this is the shape, not a formula.
    - The tech's wage, plus payroll taxes and workers' comp on top of it
    - The truck: payment, fuel, insurance, repairs, the stock on the shelves
    - The office: the person who answered the phone and scheduled you
    - Drive time between calls that the customer never sees on the bill
    - Callbacks, which we fix for free
    - Slow weeks in October when the phones are quiet and everyone still gets paid
    After all that, a healthy shop keeps a margin, and plenty of shops don't. I'd rather you understand this before you go out on your own and price yourself out of business.
  replies:
    - author: Woodbridge.ducts
      body: |
        > a healthy shop keeps a margin
        ok but if the margin is there why does every owner say they're broke lol
    - author: Kash_sing
      body: |
        Because some of them are. Two things:
        - A lot of owners pay themselves last
        - Equipment margins and service margins are very different animals
        I'm not saying every owner is honest about it. I'm saying the $189 isn't profit.
    - author: haddad_mech
      body: "Same on the mechanical side. The number new guys never see is unbilled time. Here's what I look for in a tech who's earned a raise: the one whose calls don't come back. A callback is the most expensive hour we have."
    - author: CondensateOverflow
      body: "idk, this actually helps. my boss charges about that and i always assumed he was pocketing $150 of it"
    - author: HeatwaveOnCall
      body: "so is drive time not paid for helpers?? or just not billed to the customer"
    - author: Kash_sing
      body: |
        Not billed separately in a flat call fee. Different thing from your pay:
        - Driving between calls during the workday should be paid to you as hours worked, as far as I know
        - If it isn't, that's a conversation with your boss, and the state labor department has the details
    - author: tnguyen_refrig
      body: "add to the list: the 2am walk-in call where the restaurant pays net 60. owners float a lot of money nobody sees"
    - author: big_zach_hvac
      body: "saving this. kash drew a version of this on a napkin for me once. makes more sense written down"

