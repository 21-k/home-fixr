# brief B038 (re-cast: Senior starter -> Exit145Electric; union package vs non-union cash)
- id: T132
  category: D
  topic: D1_second_year_pay
  type: question
  trade: electrical
  when: late
  fact_risk: ["union apprentice pay as a % of journeyman scale (varies by local)", "credit for prior experience on applying", "specific wage number ($25/hr) is one person's"]
  author: Exit145Electric
  title: "3 years non-union. would applying to 164 mean taking a pay cut?"
  body: "so i'm 3 years in at a small non-union shop near garfield. decent boss, no school though. been thinking about applying to the IBEW apprenticeship but from what i can tell a first year apprentice makes less per hour than i do now. i'm at $25 on the books, no benefits, no retirement. is the cut worth it? do they give you credit for the years you already have or do i start at zero? not trying to start a union vs non-union fight, just trying to do the math. thanks in advance"
  replies:
    - author: mbell_wireman
      accepted: true
      body: |
        Fair question, and you're doing the math the right way. Compare the whole package, not the hourly. Apprentice wages usually step up each year as a percentage of the journeyman rate, and on top of the check there's health coverage, pension and annuity contributions, and the schooling, none of which you have now.

        Whether they credit prior experience is a question for the apprenticeship office directly. I won't guess for 164. Some programs have ways to place experienced applicants, but don't count on it. Stay safe.
    - author: Kash_sing
      body: |
        If you want the math to be honest, price out what you have now:
        - Health insurance you'd buy on your own: get a real quote
        - Retirement: $0 now, so that's a real gap
        - School: what night classes would cost you out of pocket
        Add those to your $25 and then compare. Sometimes the cut is smaller than it looks. Sometimes it isn't.
    - author: thiago_sparks
      body: "Honestly, three years in a good non-union shop isn't nothing. If your boss will sign off on your experience toward a license someday, that's a path too. I went that way and it worked for me. But no school and no retirement at year 3 is the part I'd want fixed one way or the other."
    - author: Bergen_Ducts
      body: "don't quit before you get in, the list can take forever... wait you didn't say you were quitting lol. ignore me. but still, don't quit early"
    - author: haddad_mech
      body: "One thing from the hiring side: three years with nothing on paper is the weak spot either way. Start keeping a log of your work now and ask your boss to put your hours in writing. If you stay non-union and want a license someday, you'll need it. If you apply, it helps at the interview."
    - author: JughandleJourneyman
      body: "2nd year in 164 here... I took a cut too, came from a non-union shop in Teaneck where I was making a little more. Year one was tight. Year two the check caught up and the benefits are real. That's just me though"
    - author: Exit145Electric
      body: "appreciate it. the health insurance quote is a good point, never priced it. would a 1st year rate be like half of what a journeyman makes?"
    - author: mbell_wireman
      body: "Roughly in that neighborhood for a first-year, from what I've seen, but each program sets its own percentages and steps. The local publishes its wage sheet. Look at the actual numbers instead of guessing, and ask the apprenticeship office."
    - author: fmelecnj
      body: "1st year 164 here, i came straight from vo-tech so i didn't take a cut. but the night school alone would cost real money if you paid for it yourself. also the raises come on a schedule so you never have to go ask for one"
    - author: Passaic_Sparky
      body: "idk man, i'm 4 years non-union and i make more than my cousin does as a union apprentice. but he has a pension and i have a 2011 silverado so"
    - author: Exit145Electric
      body: "lol. ok, getting a health insurance quote this week and looking up the wage sheet before i decide anything. edit: priced it. way more than i thought."

