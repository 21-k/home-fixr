# brief B108 (NYC)
- id: T140
  category: D
  topic: D2_side_work
  type: question
  trade: electrical
  nyc: true
  when: late
  fact_risk: ["NYC electrical work for pay requires a licensed master electrician", "permit requirements for rental units"]
  author: Flushing.sparks
  title: "Landlord on my block wants me to do his apartments' outlets. I'm a student"
  body: "Trade program in Queens, graduating soon. My uncle's friend owns a couple of 2-family houses in Ridgewood and found out I'm in the electrical program. He wants me to swap outlets, put in some GFCIs and replace a few fixtures before new tenants move in. Says he'll pay $400 cash and \"nobody checks.\" My foreman at my weekend job told me absolutely not but didn't really say why. Is it really that bad if it's small stuff?"
  replies:
    - author: dreb_jman
      accepted: true
      body: |
        Brother, your foreman's right, and I'll tell you why. Here in the city, getting paid to do electrical means a licensed master electrician is behind the job, and permits get pulled where they're required. Rental apartments make it worse, not better.

        A fire in a tenant's unit gets traced back to your GFCI, and you're the kid with no license and no insurance. Don't.
    - author: auelecny
      body: "I'll ask the dumb question for him: what if it's only swapping a light fixture? That seems like nothing"
    - author: bklyn_arkady
      body: "In the city it's different, but not on this. Small stuff is where people get comfortable. And a landlord who says nobody checks is telling you exactly how he'll treat you if something goes wrong. He'll say he hired a professional and that you told him you were licensed."
    - author: Flushing.sparks
      body: "I never said I was licensed though. Never would either."
    - author: bklyn_arkady
      body: "Doesn't matter what you said. It matters what he says later, to an insurance adjuster."
    - author: codebook_dale
      body: "Not legal advice, and I'm on the Jersey side. When I see a fixture swap gone wrong, it's almost never the fixture. It's the box that wasn't secured, the backstabbed device, the neutral that wasn't where someone assumed. Small jobs fail the same ways big ones do, just with fewer people looking."
    - author: HelperForNow
      body: "different state but i asked almost the same thing about my uncle's basement a while back and nobody answered, so i'm reading this whole thread lol"
    - author: oldsteam_zig
      body: "Kid, $400 cash is the most expensive money you'll ever make if it goes bad. 28 years in and I still pull permits on jobs I could do in my sleep. That's the job."
    - author: auelecny
      body: "Ok so the fixture is a no too. Noted. Asking for me as much as him honestly"
    - author: groundrod_05
      body: "Apex grad, working non-union in the Bronx. When I was in school a guy in my class did this exact thing for a landlord and got stiffed on the money. He couldn't exactly complain to anyone. Just something to think about."
    - author: elecny85
      body: "everybody in my building's family asks me too... i just say my boss would fire me, which is true lol"
    - author: Flushing.sparks
      body: "That's a good line, stealing it. My uncle's going to be annoyed though"
    - author: dreb_jman
      body: "Your uncle will get over it. Tell the landlord to hire a licensed electrician and ask if you can shadow the job. That's how you turn this into something."
    - author: Flushing.sparks
      body: "update: told him no. Asked him who he's hiring instead and he gave me the guy's number. Calling him Saturday."
    - author: dreb_jman
      body: "Good. That's the right move. Let me know how the call goes, brother."

