# brief B003 (Senior starter, NYC)
- id: T157
  category: F
  topic: F7_nyc_commute_from_nj
  type: tip
  trade: electrical
  nyc: true
  when: late
  author: dreb_jman
  title: "For the Jersey apprentices on my crew: the commute, honestly"
  body: |
    Half my apprentices live in Jersey, so I've heard every version of this. Here's what I tell them.

    Don't drive in unless the job pays for parking or you have a spot. Between the crossing, the tolls and a garage in Midtown, you're working the first hour of the day for free. Train or PATH, then walk.

    Leave earlier than you think. A 7am start means on the floor at 7 with your glasses on, not walking in the door.

    Don't move to the city in year one. You don't know where your jobs will be in two years, and rent will eat you alive.

    And I'm not one to talk. My sister lives in Bayonne, and every Sunday after dinner I sit in tunnel traffic going home and swear never again. So I get it, brother.
  replies:
    - author: Edison.volts
      body: "New Brunswick to Midtown on NJ Transit is like an hour and a half door to door. Is that normal for guys on your crew brother?"
    - author: dreb_jman
      body: "Some of them do worse. The guys from down your way are on the first train out. It's doable for a few years. It gets old."
    - author: hudson_conduit
      body: "union city here, i can see the city from my window and the week we had a job over there it took me an hour because of the bus to the tunnel lol"
    - author: bklyn_arkady
      body: "In the city it's different for us plumbers, we're in the van all day, so parking is my whole life. Brooklyn street parking with a work van is a sport. For electricians in Midtown, take the train, absolutely."
    - author: plumbguy917
      body: "bay ridge to anywhere in manhattan is also an hour lol, it's not just jersey people"
    - author: threeway_02
      body: "Question from someone not in yet: do apprentices get any say in which jobs they're sent to? Or could you end up in the city even if you apply in Jersey?"
    - author: dreb_jman
      body: "Depends on the local and its jurisdiction. I can only speak for Local 3, and you go where the work is. If you apply in Jersey, ask that local how they assign."
    - author: neutral_bar_99
      body: "My uncle commuted from Wayne to the city for 20 years on the bus. He says the trick is sleeping on the bus and never driving. He has not driven into Manhattan since the 90s."
    - author: Edison.volts
      body: "Sleeping on the train I can definitely do. Already practicing on the way home"
    - author: hudson_conduit
      body: "the real trick is never missing the bus lol. miss one and you're late for everything all day"
    - author: JerseyTomatoWires
      body: "164 so I stay in Jersey, but my foreman did years in the city before he came over here... he says he doesn't miss the trains, he misses the lunch spots"
    - author: dreb_jman
      body: "Your foreman's right about lunch. That's the one thing Midtown has on Jersey."
    - author: bklyn_arkady
      body: "I grew up in Jersey and I'll say this: the bagels are a tie and the pizza is closer than either side admits."
    - author: threeway_02
      body: "Appreciate the honest answers. Leaving the city question alone until I'm actually in somewhere."

