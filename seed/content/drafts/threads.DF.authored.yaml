# brief B111 (Senior starter)
- id: T149
  category: D
  topic: D4_prevailing_wage
  type: tip
  trade: electrical
  when: late
  fact_risk: ["prevailing wage coverage thresholds/exceptions", "what a project labor agreement is", "apprentice classification on public works"]
  author: mbell_wireman
  title: "Prevailing wage vs PLAs: why the big public jobs look the way they do"
  body: |
    This keeps coming up, so here's the union-side view. I'd welcome the non-union contractors here to correct me where it's different for them.

    Prevailing wage is a floor. On covered public work, everyone gets at least the published rate for their trade and county, union or not.

    A project labor agreement is a different thing. It's an agreement for a specific project, usually a big one, about labor terms: hiring through the trades, how disputes get handled, no strikes. You'll hear about them on large public construction.

    If you're an apprentice and you land on one of these jobs, a few things will be new: sign-in sheets, long safety orientations, and someone checking that your classification matches your paperwork. Bring your ID, bring your card, wear your glasses. Stay safe.
  replies:
    - author: haddad_mech
      body: "Mostly right, and thanks for asking for the other side. One thing I'd adjust: it isn't every public job. There are thresholds and exceptions, and the state's site spells them out. From the non-union side, the certified payroll is the real cost of public work, not the wages. On PLAs, I'll just say not every contractor thinks they're good for competition, and leave it there."
    - author: mbell_wireman
      body: "Fair correction on the thresholds, and I appreciate you keeping it civil. Plenty of people on my side would say the same thing about PLAs from the other direction."
    - author: codebook_dale
      body: "From the inspection side: whatever the labor terms are, the code doesn't change. I've seen people on public jobs assume the rules are different because the paperwork is. Check which code edition is in effect for the project, and read the project specs, which sometimes ask for more than code."
    - author: neutral_bar_99
      body: "This is very helpful. My teacher mentioned PLAs once and moved on. When you say classification has to match your paperwork, does that mean a student couldn't work on one of these at all?"
    - author: mbell_wireman
      body: "Not at an apprentice rate unless you're in a registered program, as I understand it. That's a question for your instructor and the state's rules, though. Finish school first. The jobs will still be there."
    - author: peteplumb80
      body: "1st year in 24, did a week on a public school job in july. the sign-in sheet thing is real. the safety orientation was 3 hours and half of it was ladders lol"
    - author: JerseyTomatoWires
      body: "the orientation on the big jobs is long... my foreman says that's where they catch the guys who don't belong there. bring your card"
    - author: dhollis61
      body: "certified payroll is why my old shop stopped bidding them. good jobs if your office can handle it."
    - author: Exit117Plumber
      body: "saving this for when I graduate, didn't know any of it. our class is going to get a lot of questions from me now"

