# brief B132 (re-topiced: third GC brief -> heat-wave rant)
- id: T173
  category: F
  topic: F9_weather_rant
  type: discussion
  trade: electrical
  when: early
  author: JunctionBoxJunkie
  title: "It was 97 outside and I swear 140 in that attic"
  body: "Summer job, helping an electrical contractor while school's out. Today we ran a new circuit for a bathroom fan in a Cape in Hamilton, which meant the attic. In the heat wave. My shirt was soaked through in four minutes. I drank three bottles of water and my boss made me come down every 20 minutes, which I was mad about until I got dizzy on the ladder coming down the last time. I'm fine. Sat in the truck with the AC on for a while. Is this just what summers are? How do you all do this for 20 years?"
  replies:
    - author: mbell_wireman
      body: "Your boss made the right call, and I'm glad he did. Heat illness sneaks up on people, and dizziness on a ladder is exactly how someone gets hurt. Do attic work early in the morning, take breaks before you need them, water plus something with electrolytes. If you feel off, you come down. Stay safe."
    - author: tnguyen_refrig
      body: "try a walk-in compressor on a boardwalk roof in july. at least your attic had shade lol"
    - author: thiago_sparks
      body: "Honestly the shore attics are the worst. Raised houses, dark shingles, no ventilation. I schedule attic work before 10am in July and August now, period. Took me way too long to learn that."
    - author: big_paulie_plumb
      body: "20 years? i'm 4 years in and i already bought a cooling towel and a little fan that clips on my hard hat. no shame"
    - author: HeatwaveOnCall
      body: "hvac helper in clifton, we did 3 attic air handlers this week. my handle was a joke when i made it. it's not a joke anymore"
    - author: JunctionBoxJunkie
      body: "Ordering the cooling towel. My boss also said nobody gets a medal for staying up there. Writing that on my tool bag."
    - author: hec_does_ac
      body: "Lol that's a good boss... So this one time in AC, a guy on my crew didn't come down when he should have and we had to help him out of the attic. He was ok. Come down when your boss says come down"
    - author: codebook_dale
      body: "One thing from my side, since I inspect a lot of summer attic work: when you're miserable, you rush, and rushed connections are what fail later. Take the break, then make the connection right. Heat makes people skip steps."

