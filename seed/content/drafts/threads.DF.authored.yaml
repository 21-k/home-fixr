# brief B007 (re-topiced: duplicate pork roll brief -> back-to-school post by the same Senior)
- id: T158
  category: F
  topic: F10_back_to_school
  type: discussion
  trade: hvac
  when: mid
  author: ms_almonte
  title: "First week of the fall semester: 22 new faces, three have held a torch"
  body: |
    Every September I swear I'll stop being surprised, and every September I'm surprised. New class started this week. Twenty-two of them. Three have held a torch, and one of those set his sleeve on fire in the first hour. Nobody hurt, everybody learned something.

    First thing I teach, before anything technical: where the extinguisher is and how to use it. Second: how to sweep a floor properly. They laugh at that one. They stop laughing when they find out how much of the job it is.

    For anyone who trains helpers: what's the first thing you make a new person learn? Ask me how I know it matters.
  replies:
    - author: oldsteam_zig
      body: "Where the main shutoff is, kid. Before anything else. Every house, every job, find the main and make sure it actually turns. That's the job."
    - author: mbell_wireman
      body: "Lockout/tagout and how to verify a circuit is dead, before they touch a tool. Then glasses on every day, no arguments. Good luck with the 22. Stay safe."
    - author: hec_does_ac
      body: "So this one time in AC... first day on a hotel job I made the new kid learn where the exits were before anything else lol. Sounds dumb. He still got lost in the basement for an hour on day two"
    - author: CentralJersey_Coils
      body: "Student in a different county here, and our teacher did the extinguisher thing first too. Then we swept for a week. I understand why now."
    - author: joyd_plumbing
      body: "Mine: show up ten minutes early and write down what you're told. A notebook in the back pocket fixes half the problems I see with new helpers."
    - author: TaylorHamHVAC
      body: "career switcher here. the notebook thing is real. my first month i wrote down everything my lead said and reread it at night. still do it"

