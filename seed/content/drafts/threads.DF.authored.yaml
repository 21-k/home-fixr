  author: OpenNeutralBlues
  title: "Got the call. Interview for the IBEW apprenticeship is next month"
  body: "Applied over the summer because my shop teacher would not stop bringing it up. Took the aptitude test. Got a call today with an interview date. I was at the Wawa when my phone rang and almost dropped my coffee. Not in yet, I know. But I didn't think I'd get this far. What do I wear and what do they ask?"
  replies:
    - author: dreb_jman
      body: "Brother, congrats. That's a big step. I can only speak for how mine went years ago: clean simple clothes, on time means early, and be honest. They want to know you'll show up and listen. Don't pretend you know more than you do."
    - author: mbell_wireman
      body: "Congratulations. Bring proof of any work or school you have, even weekend helper hours. Know why you want this trade in one or two sentences. And when they ask about safety, mean it. Stay safe."
    - author: mselecnj
      body: "1st year 164. i wore a button down and was the most overdressed guy in the room lol. still got in. just be on time"
    - author: ms_almonte
      body: "Practice saying your answers out loud before the day. My students who do mock interviews with me always do better than the ones who wing it. Ask me how I know."
    - author: epa60812_2
      body: "congrats brother. hvac guy here but rooting for you, update us after the interview"

