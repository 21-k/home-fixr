# brief B081 (re-topiced: third NYC-commute brief -> first heating call of the season, NJ)
- id: T168
  category: F
  topic: F8_first_solo_calls
  type: discussion
  trade: hvac
  when: late
  author: kofihvac87
  title: "First heating call of the season and the thermostat was set to COOL"
  body: "First cold morning this week and the phones at the shop went off. My first heating call of the season, in Roselle: \"furnace blowing cold air.\" I pulled the panel, checked the flame sensor, checked the inducer, checked the filter. Twenty minutes in, the homeowner's daughter asked if the thermostat was supposed to say COOL. It was. Switched it to HEAT and the furnace fired right up. We still charged the service fee because the office said so, and I felt terrible. Lol. Two years in and I still fell for it."
  replies:
    - author: hec_does_ac
      body: "Lol everybody has one of these... thermostat first is the oldest lesson in the book and we all learn it the hard way anyway. Welcome to heating season"
    - author: Kash_sing
      body: |
        Don't feel terrible about the fee. You drove there, diagnosed it, and checked the flame sensor and filter while you were in there, which is real work. Two things I'd do:
        - Tell the customer what you checked, so they know they got something
        - Write "tstat in cool" on the ticket so the office starts asking that question on the phone
        The first cold week is full of these.
    - author: ms_almonte
      body: "First thing I tell students on a no-heat: talk to the thermostat before you talk to the furnace. Second: ask the homeowner what changed since the last time it worked. Ask me how I know you'll still forget once a year."
    - author: big_zach_hvac
      body: "did the exact same thing last week in elizabeth. except it was the fan set to ON not AUTO. homeowner thought it was broken because it blew cold between cycles"

