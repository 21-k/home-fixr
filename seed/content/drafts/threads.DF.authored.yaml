# brief B075
- id: T142
  category: D
  topic: D3_going_out_on_own
  type: question
  trade: electrical
  when: late
  fact_risk: ["HIC registration vs licensed trade work (NJ Contractors' Registration Act)", "electrical work for pay requires a licensed EC", "what an LLC does and doesn't do"]
  author: LiveFrontLessons
  title: "me and a buddy want to start an LLC doing handyman + small electrical. is HIC enough?"
  body: "ok so hear me out. my buddy is a carpenter, i'm a year out of vo-tech working for an electrical shop near asbury. we want to start an LLC on the side, register as a home improvement contractor with the state, and do bathroom refreshes, decks, and the \"small electrical\" like fixtures, outlets, fans. he says the HIC registration covers all of it as long as it's under the LLC. is that right? and what insurance would we even need for something like that? we're not trying to do panels or anything crazy"
  replies:
    - author: codebook_dale
      accepted: true
      body: |
        Not legal advice, just how I'd look at it: as I understand NJ's rules, home improvement contractor registration is not an electrical license and doesn't cover electrical work. If you're paid for it, a licensed electrical contractor has to be the one running it. "Small" isn't a category in the code.

        Call the Division of Consumer Affairs and ask them directly before you form anything.
    - author: Kash_sing
      body: |
        Same in my trade. As I understand it:
        - HIC registration covers general home improvement work
        - Licensed trades (electrical, plumbing, HVACR) need the license, or a licensed contractor running the work
        - An LLC is a business structure, not a license
        Your buddy's carpentry side may be fine under HIC. Check with Consumer Affairs for your exact case.
    - author: LiveFrontLessons
      body: "wait so he can do the decks but i can't do the fans? even under the same company?"
    - author: dhollis61
      body: |
        > even under the same company?
        yes. the company doesn't make you licensed.
    - author: HelperForNow
      body: "this is basically what my boss's shop is. he's licensed, his brother does the carpentry under the same company. the license is the part that makes it work"
    - author: mbell_wireman
      body: "Also think about the fact that you already work for an electrical shop. Doing the same kind of work on the side, in the same area, is going to get back to your boss. Small state. Talk to him before you do anything; some owners will even help you find a path."
    - author: Exit117Plumber
      body: "my foreman says the same thing about plumbing. he says the fastest way to lose your shot at a license is getting caught doing licensed work without one. not sure if that's true word for word but he was dead serious"
    - author: LiveFrontLessons
      body: "ok so what if my buddy does the bathrooms and we just sub the electrical out to a licensed guy?"
    - author: thiago_sparks
      body: "Honestly that's how a lot of legit small outfits work. You pay the licensed EC, he pulls the permit and does or supervises the work. You learn by being on his jobs. Less money for you, but it's clean, and you're building a relationship with someone who might hire you or sign off on your hours."
    - author: Kash_sing
      body: |
        And on insurance, if you go that route:
        - General liability for the LLC, with a carrier that knows contractors
        - Every sub shows you a current certificate of insurance before they start
        - Workers' comp if you hire anyone
        Get quotes before you price your first job. It will change your prices.
    - author: rui_t_kearny
      body: "One thing I'd push back on a little, thiago. Subbing out is clean, but a lot of the shops that sub for small outfits get burned on payment and stop doing it. Make sure the EC knows you pay on time, or you won't find one twice. My father stopped subbing for two GCs in one year over that."
    - author: thiago_sparks
      body: "Fair point. I've been the EC who got stiffed, more than once. Pay your subs."
    - author: LiveFrontLessons
      body: "my buddy is not happy lol. he thought the LLC thing was a loophole"
    - author: codebook_dale
      body: "It's the most common misunderstanding I hear. As I understand it, an LLC is about liability and taxes, and a lawyer or an accountant should tell you what it does and doesn't protect. It doesn't license anyone to do anything. Have him call Consumer Affairs too, so he hears it from them and not from strangers online."
    - author: NorthJerseyCopper
      body: "I asked the insurance half of this in another thread. Short answer was get real quotes, and it's more than you think."
    - author: neutral_bar_99
      body: "Our teacher said something similar when a kid asked about LLCs. I wrote it down: the LLC is paperwork you filed, the license is a test you passed. Not his exact words, but close."
    - author: LiveFrontLessons
      body: "update: talked to my boss like mbell said. he laughed at the LLC part, then said if my buddy lands bathrooms the shop will do the electrical and i can be on those jobs. so that's kind of a win?"
    - author: thiago_sparks
      body: "That's a big win. That's how your name gets around. Sounds like a good boss, hang onto him."

