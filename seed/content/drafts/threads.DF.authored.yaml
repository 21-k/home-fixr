# brief B128
- id: T135
  category: D
  topic: D1_second_year_pay
  type: question
  trade: plumbing
  nyc: true
  when: late
  fact_risk: ["NYC helper pay ($20/hr) is one person's", "NYC master plumber experience documentation", "Local 1 wage sheet is published"]
  author: BayRidge.traps
  title: "brooklyn non-union helper pay vs local 1, what's normal?"
  body: "Apex grad, working for a small non-union shop out of Canarsie, mostly service and drain calls. Applied to Local 1 and waiting. I'm at $20 an hour on the books. My foreman says that's good for the city for a first year helper. A guy I graduated with says he makes more at a shop in Queens doing new construction. What's normal in the city for year one non-union? And is it worth waiting on the union or should I just stay put."
  replies:
    - author: bklyn_arkady
      accepted: true
      body: |
        In the city it's different, and pay is all over the place. From what I see, and what I pay, a first-year helper at a small Brooklyn service shop is somewhere around where you are, give or take a couple of dollars. New construction sometimes pays more per hour, and it's steady until it isn't.

        Don't compare the hourly alone. Ask about overtime, transit or parking, and whether they'll document your experience. If you ever want a license here, documented years under a licensed master are the whole game.
    - author: plumbguy917
      body: "local 1 first year here. not posting my rate but look up the wage sheet, it's public. the benefits are the big part. took me 2 tries to get in lol"
    - author: Kash_sing
      body: |
        I'm in Jersey, so I can't speak to city numbers, but the same checklist applies:
        - Hourly
        - Overtime, and how often
        - Health insurance
        - Travel: tolls, parking, transit
        - School
        The Queens guy might be ahead on one line and behind on three.
    - author: peteplumb80
      body: "jersey side, local 24 first year. i'll just say my package looked way better on paper than my hourly did, which is kind of the point. don't sit around waiting though, keep working"
    - author: haddad_mech
      body: "On 'should I wait': you don't have to choose. Keep working and keep the application alive. Here's what I look for when I hire, union or not: somebody who kept working while they waited. A waiting list never trained anybody."
    - author: bklyn_arkady
      body: "One more thing on documenting: keep your own copy of everything, even if your foreman is good about it. Shops close, masters retire, and you don't want your years depending on someone answering the phone in 2032."
    - author: plumbguy917
      body: "^ this. my uncle lost 3 years of paperwork when his old boss retired to florida lol"

