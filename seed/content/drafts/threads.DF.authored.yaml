# brief B070 (re-cast: OpenNeutralBlues already starts T169 -> EssexPipes)
- id: T166
  category: F
  topic: F3_quit_bad_shop
  type: question
  trade: plumbing
  author: EssexPipes
  title: "Boss threw a pipe wrench across the basement. Quit on the spot."
  body: "Two years out of the county vo-tech, 14 months at this shop in Essex. All demo, all carrying, and a boss who throws tools when he's in a mood. Today it was a pipe wrench across a basement. Didn't hit anybody. I put my stuff in my car, told him I was done, and drove home. Already have an interview Thursday with a shop in Montclair that does service. Did I mess up by not giving notice? Should I call him and smooth it over or just let it go?"
  replies:
    - author: joyd_plumbing
      accepted: true
      body: |
        What's your actual question? Because "did I mess up" and "should I call him" have different answers.

        Did you mess up: no. Someone throwing a pipe wrench in a basement is a safety problem, not a mood. Should you call: a short text saying you won't be back and where to send your last check is enough.
    - author: rui_t_kearny
      body: "Don't trash him around the supply houses, though, even if he deserves it. People will hear about the wrench without your help. You just be the guy who shows up Thursday."
    - author: peteplumb80
      body: "montclair has a few decent service shops. good luck thursday. wear the clean boots"
    - author: mbell_wireman
      body: "Agree with both. Thrown tools are how people get hurt, and you don't owe notice to someone who makes the site unsafe. Write down the date and what happened, in case it ever matters for anything."
    - author: EssexPipes
      body: "Sent the text. He replied with a thumbs up. That's the most communication I've gotten from him in a year. Interview's Thursday, boots are clean."

