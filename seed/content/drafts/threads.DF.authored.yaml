# brief B063
- id: T133
  category: D
  topic: D1_second_year_pay
  type: question
  trade: hvac
  when: late
  fact_risk: ["benefit waiting periods (anecdotal)", "NJ employers' workers' comp requirement"]
  author: Woodbridge.ducts
  title: "first year helper, no health insurance, no PTO. normal?"
  body: "started at a residential hvac shop in woodbridge this summer. $18/hr on the books, no health insurance, no paid days off, and they said maybe benefits after a year. owner says that's how every small shop does it. is that true or is he just saying it? not complaining about the hourly, just want to know what's normal before I think about looking around brother"
  replies:
    - author: Kash_sing
      accepted: true
      body: |
        Common for small shops, not universal. What I see around Middlesex:
        - Some shops start health insurance at 60 or 90 days
        - Some never offer it and pay a bit more instead
        - Paid time off for first-years is often a few days, if any
        A one-year wait isn't unusual. "Maybe" is the word I'd ask about. Ask him what the policy actually is and whether it's written down anywhere.
    - author: hec_does_ac
      body: "Lol my first shop in Pennsauken said benefits 'after a year' and then I found out nobody had ever made it to a year... Ask how many guys are on the plan right now. That tells you more than the policy does"
    - author: mbell_wireman
      body: "Also confirm he's carrying workers' comp for you. As far as I know NJ employers are supposed to, and being on the books usually means yes, but ask. If you get hurt in an attic, that's the coverage that matters first."
    - author: HeatwaveOnCall
      body: "same at my shop in clifton, no insurance first year. but they're paying for my 608 test and the practice tests and i get the van on call weeks, which i guess is worth something? did yours say anything about the 608? or tools"
    - author: Woodbridge.ducts
      body: "608 yes, they paid for it. tools no. ok, I'll ask him how many guys are actually on the plan. thanks brother"
    - author: CondensateOverflow
      body: "3rd year in bound brook, mine kicked in at 90 days. so it really varies by shop. ask around at the supply house"
    - author: Woodbridge.ducts
      body: "update: asked. 4 out of 6 guys are on the plan, all of them past a year. so I guess it's real. staying for now"

