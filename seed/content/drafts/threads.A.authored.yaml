# ============================ A6. NYC ============================
# brief B014
- id: T051
  category: A
  topic: A6_nyc_local3_interview
  type: question
  trade: electrical
  nyc: true
  author: groundrod_05
  when: mid
  title: "Got called for the Local 3 interview after a year of waiting. What do they look for?"
  body: |
    Apex grad, working non-union in the Bronx for two years while I waited. I got the letter this week: I have an interview. I have been preparing with my mentor here, but I want to hear from more people.

    What did your interview look like? What do they want to hear from someone who already has some field experience? I do not want to sound like I know everything, but I also do not want to undersell the two years I put in. Appreciate any advice.

    edit: interview is Monday, not next week. I misread the letter.
  fact_risk: ["Local 3 interview format", "how applicants are notified"]
  replies:
    - author: dreb_jman
      accepted: true
      body: |
        Brother, you already know what I think, but for everyone else reading: the format changes, so I'm talking about what matters, not what the room looks like.

        Be on time. Dress clean and simple. Answer the question they asked. When they ask about your year, give one real job start to finish and one mistake you made and what you learned. Don't trash your current shop. And leave an hour early, the trains have been a disaster.
    - author: Flushing.sparks
      body: "Good luck. Please post how it goes, I'm a year or two behind you."
    - author: wchen_controls
      body: "fwiw i interviewed for a different program years ago and the thing that helped most was having a couple of questions for them at the end. shows you care what happens after you get in"
    - author: WawaRunWired
      body: "sorry if this is dumb but do they ask technical questions or just about you? asking for when i apply in jersey. thanks in advance"
    - author: groundrod_05
      body: "From what people told me, mostly about you and your work, but I am not sure. I will report back after."
    - author: bklyn_arkady
      body: "In the city it's different in a lot of ways, but an interview is an interview everywhere. I hire helpers for my shop, and what I always remember is whether they could explain something simple clearly. Practice explaining a job out loud to someone who isn't in the trade."
    - author: auelecny
      body: "Army guy here, interviews are just inspections with chairs. Clean shoes, short answers. Idk if that translates but it worked for every job interview I've had."
    - author: groundrod_05
      body: "update: had it. Mine felt like mostly questions about my work and why electrical. I talked about a service change we did in Throggs Neck and the time I mislabeled a panel. Felt okay. Now I wait again. Appreciate everyone here, and dreb especially."

