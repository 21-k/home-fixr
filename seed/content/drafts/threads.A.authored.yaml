- id: T057
  category: A
  topic: A7_low_voltage_way_in
  type: discussion
  trade: electrical
  author: wchen_controls
  when: late
  title: "low voltage is a way in, and nobody at the vo-tech ever mentions it"
  body: |
    small rant, then useful info. every year i meet vo-tech kids who've only heard about two options: line-voltage electrician, union or non-union. nobody tells them about building automation, fire alarm, security, data.

    i've been in bms and fire alarm 14 years, somerset and middlesex mostly. it's a real trade. you still need to understand electricity, you still work under codes and permits, and in nj fire alarm work has its own licensing as far as i know, so check what applies to the work you'd be doing.

    the pay is fine, a lot of the work is indoors, and your knees last longer. fwiw if you like troubleshooting more than pulling wire, look at it. ask me anything.
  fact_risk: ["NJ fire alarm licensing requirements", "controls integrators hiring from line-voltage shops"]
  replies:
    - author: Exit145Electric
      body: "this is me, 3 years non-union in garfield doing emt and bending and i like the troubleshooting part way more. how do you even get hired into controls with no controls experience? appreciate it"
    - author: wchen_controls
      body: "a lot of integrators hire installers from line-voltage shops because you already know how to be on a site. call the controls companies near you and ask if they take apprentices or installers. fwiw the first year is a lot of pulling cable and labeling, same as anywhere"
    - author: mbell_wireman
      body: "Agree it's a real trade, and plenty of our journeymen end up in controls. One gentle correction for the kids reading, though: don't skip the line-voltage fundamentals to get there. The best controls people I've worked with could also wire a motor starter. Learn both if you can. Stay safe."
