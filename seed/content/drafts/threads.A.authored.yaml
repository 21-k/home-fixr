      body: "Tell your father this, from someone who hires every year: here's what I look for when I hire, and age isn't on the list. Reliability, listening, and a clean driving record. Warehouse guys usually have the first two down. The real question is his body in an attic in July, so have him ride along on a hot day before he quits anything."
    - author: Kash_sing
