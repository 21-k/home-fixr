# brief B146
- id: T022
  category: A
  topic: A1_union_vs_school_vs_shop
  type: question
  trade: electrical
  author: JunctionBoxJunkie
  when: mid
  title: "My shop teacher won't stop pushing the union application. Why is he so sure?"
  body: |
    Some context first because it matters. I'm in the electrical program at the Mercer County vo-tech, I've been doing weekend helper stuff for a guy in Hamilton since June (mostly carrying, some pulling wire), and my shop teacher brings up the IBEW application basically every class. Like every single class. He hands out the flyer, he talks about the pension, he tells us non-union is a dead end.

    The guy I work weekends for is non-union and he's doing fine. Owns two vans, takes his family to Wildwood every August.

    So who's right? I'm not against the union. I just don't like being told there's one answer when I can see with my own eyes there's at least two.
  fact_risk: ["union apprenticeship features (wage scale, benefits, school)", "IBEW Local 400 jurisdiction for Manahawkin"]
  replies:
    - author: mbell_wireman
      accepted: true
      body: |
        Your teacher has probably watched what the apprenticeship did for students before you, and that's a fair reason to push it. Structured school, a wage scale that steps up on a schedule, benefits, safety training built in. Those are real.

        "Dead end" is too strong, though. Plenty of non-union electricians do well, and your weekend guy is proof. The honest version: the union path is a known path, and a good non-union shop can also be a good path. Apply, keep working weekends, and decide with real offers in front of you. Stay safe.
    - author: thiago_sparks
      body: "Honestly I'm the non-union guy your teacher is warning you about. Own my shop in Long Branch, went to trade school, did fine. But I'll admit the union guys my age have a pension I don't. Both things are true. Don't let either side tell you the other one's a scam."
    - author: peteq75
      body: "Former teacher here (middle school, not shop). Teachers push the thing they've watched work for their students. Doesn't make it the only thing, but he's not trying to scam you. Sorry, I know that's not a real answer."
    - author: JunctionBoxJunkie
      body: |
        > he's not trying to scam you

        Fair. I didn't mean he's scamming anybody. It's the "dead end" thing that gets me, because my weekend guy clearly isn't one.
    - author: rui_t_kearny
      body: "I left the union and I half regret it, so take that for what it is. What I miss most is the training. What I don't miss is sitting by the phone between jobs some years. My father used to say every road has tolls, you just have to know which ones you're paying."
    - author: haddad_mech
      body: "Here's what I look for when I hire a kid out of vo-tech: shows up, has some hours, can pass a background check. Whether he applied to the union doesn't come into it. If you end up non-union, ask about school and how raises work before you take the job."
    - author: Flushing.sparks
      body: "Same thing at my school in Queens, except it's Local 3 every class. The foreman at my weekend job says the same thing yours does."
    - author: HelperForNow
      body: "non-union in manahawkin, 1 year. i put in for 400 anyway just to see what happens. no harm in having options"
    - author: JerseyTomatoWires
      body: "4th year in 164... your teacher isn't wrong and neither is your weekend guy. my foreman says some of the best apprentices he gets came from shops like that... apply and keep the weekend job"

