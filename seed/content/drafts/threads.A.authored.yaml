      body: "Show up in person. Early, in work clothes, with a one-page sheet. It's harder to hang up on someone standing at your counter. I got the same comments at 26. The ones who said dumb things weren't shops I wanted to work for anyway. The one who hired me cared that I came back twice. Call the nice one back in October like they said, and mention that you called before."
    - author: big_nicole_plumb
      body: |
        Burlington County, 3 years. The bathroom thing is so dumb, every job has a porta john or a Wawa down the road. Keep calling. There are good shops down here that hire women, mine's one of them, they just don't advertise it.

        edit: also ask at the supply house counter. They know which shops are decent.
    - author: ginaj75
      body: "plumbing, pleasantville, vo-tech grad. only girl in my class. got hired by the 4th shop i walked into. the first 3 were weird about it. keep going"
    - author: Dev_H
      body: "Deptford here. Appreciate you posting this. Were the ones that hung up small one-man outfits or bigger shops? Not asking for names. The bigger ones around here are usually better about it."
    - author: rui_t_kearny
