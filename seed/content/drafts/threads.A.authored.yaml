  title: "Do union apprenticeships drug test now that weed is legal in Jersey?"
  body: "Asking for real, not trying to be funny lol. I'm at a non-union shop in Union City, nobody's ever tested me. Thinking about applying to the IBEW next year. I smoke sometimes on weekends, it's legal now. Do they test before you start? Random? Does legal even matter for that? Not looking for a lecture, just want to know what I'm walking into so I'm not dumb about it."
  fact_risk: ["union apprenticeship drug testing policies", "NJ cannabis law vs employer and site safety policies"]
  replies:
    - author: mbell_wireman
      accepted: true
      body: |
        Fair question, no lecture. I can't speak to any program's current policy; ask them directly or read their application materials.

        From the job side: a lot of the sites we work on, especially big commercial and data centers, have their own testing rules regardless of state law, and contractors follow the site's rules. Legal at home doesn't mean allowed on a site. If you want the job, plan as if you'll be tested. You're working around energized equipment. Stay safe.
    - author: codebook_dale
      body: "Not legal advice, just how I'd look at it: state law on cannabis and an employer's safety policy are two different questions, and the second one is the one that decides whether you work on Monday."
    - author: big_hector_plumb
