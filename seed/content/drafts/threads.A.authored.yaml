  replies:
    - author: thiago_sparks
      accepted: true
      body: "Honestly they exist, I'm one of them. I pay for night classes for my helpers once they've been with me a while, because I'd rather pay for school than keep training new guys. Not every shop does it. Ask in the interview: 'Do you help with school, and when does that start?' A shop that gets weird about the question just told you something."
    - author: benplumb79
      body: "Mine doesn't, for what it's worth, and I didn't ask before I took the job. I wish I had. Sorry, that's more of a warning than an answer."
    - author: neutral_bar_99
      body: "My cousin's shop in Totowa reimburses you after you pass the class, not before, so he had to pay up front and wait. It might be worth asking how they pay, not only whether they pay. I'm still in school myself, so this is secondhand."

