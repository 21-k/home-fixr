- id: T058
  category: A
  topic: A9_application_paperwork
  type: tip
  trade: electrical
  author: mbell_wireman
  when: early
  title: "Before application season: get your paperwork together now, not the week it opens"
  body: |
    Every year I watch people scramble for documents the week an application opens. Don't be that person.

    I can't tell you what any specific program requires; each apprenticeship posts its own list, and you should go by that. But in my experience the usual suspects are proof of age, your high school diploma or equivalent, sometimes a transcript, a driver's license, and for veterans, discharge paperwork. Some of those take weeks to get.

    Request your transcript now. Find your birth certificate now. If your license is suspended, deal with it now. None of this is exciting. All of it has cost people a year. Stay safe.
  fact_risk: ["typical apprenticeship application documents", "transcript turnaround times"]
  replies:
    - author: threeway_02
      body: "This is timely. I had no idea where my high school diploma was. I graduated in 2008. Requested a copy this morning."
    - author: MonmouthPlumber
      body: "UA Local 9, 3rd year. Agree on the transcript, mine took almost a month to come from my old school. Thanks in advance to whoever reads this and starts now."
    - author: PullingWireAgain
      body: "sorry, dumb question... does a vo-tech certificate count as the diploma or is that separate"
    - author: mbell_wireman
      body: "Not dumb. They're usually separate; the diploma is the high school credential, and the vo-tech certificate is extra. Bring both. Check the program's list to be sure."

