  replies:
    - author: ms_almonte
      accepted: true
      body: "Speaking as someone who teaches in one: first, ask your program's coordinator directly, because whatever arrangements exist are specific to your school and to the apprenticeship you apply to. Second, assume nothing transfers automatically. Some apprenticeships may look favorably on a program, and some licensing paths may count certain schooling, but you'll want it in writing either way. Third, keep every certificate and transcript. Ask me how I know you'll need them years later."
    - author: BergenPlumber
