# brief B143 (Senior tip; cast extended: QuickChekCrew, WhichTradeTho)
- id: T037
  category: A
  topic: A3_votech_worth_it
  type: tip
  trade: other
  author: Kash_sing
  when: mid
  title: "Before you sign a private trade school loan, ask these questions"
  body: |
    Every few weeks a new hire tells me what they owe on a private trade school program, and some of them didn't need to owe it. I'm not against private schools. Some are good. But ask these before you sign anything:
    - What's the total cost, including tools, books and fees, not the monthly payment
    - How many hours are hands-on shop time versus classroom
    - What share of graduates are working in the trade a year later, and how do they count that
    - Does the county vo-tech or community college near you have an adult program for less
    - Would an employer pay for it if you got hired first

    If the admissions person gets pushy when you ask, that's an answer too.
  fact_risk: ["private school vs county adult program cost difference"]
  replies:
    - author: ms_almonte
      body: "All good questions. I'd add one from my side: ask to sit in on a shop class before you enroll, on a normal night. You'll see in ten minutes whether students are working or watching. Ask me how I know some programs don't love that request."
    - author: haddad_mech
      body: "Here's what I look for when I hire, since it's related: I don't check where someone went to school. I check whether they can do the work and whether they show up. A certificate helps you get the interview, not the job."
    - author: QuickChekCrew
      body: "I'm doing the county night HVAC program twice a week... it was a fraction of what the private school quoted me... thanks in advance to anyone who knows if the county ones are any good for electrical too"
    - author: thiago_sparks
      body: "Honestly I'm the guy who went to a private trade school and it worked for me. But I was 19, lived with my parents and had no bills. It's different math if you're 35 with rent. I'd push back a little on making it sound like a trap."
    - author: Kash_sing
      body: |
        Fair point, Thiago, and I'm not saying skip them:
        - If the cost works and you learn better in a classroom, it can be worth it
        - If you can get hired as a helper first, try that before you borrow
    - author: rui_t_kearny
      body: "My father used to say never borrow for something you can get paid to learn. He wasn't always right, but he was right about that one."
    - author: tnguyen_refrig
      body: "refrigeration side, nobody ever asked where i went to school. they asked if i could find a leak on a walk-in in july. winter is when you learn, and you can learn it for free if you're on somebody's truck"
    - author: WhichTradeTho
      body: "I'm taking one night class at the community college to test the waters before I commit to anything. Cheaper than any program and I'll know by December if I hate it."

