      body: "Your teacher has the stronger argument. I can't tell you whether any program keeps notes from a previous interview; ask them. But I've never heard anyone say they regret applying early. Apply when you're eligible, work full time while the process runs, and if you need a second try you'll have the year of experience anyway. You get both. Stay safe."
    - author: TryingAllThree
