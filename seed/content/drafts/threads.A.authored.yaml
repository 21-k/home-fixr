# ======================== A5. Tools, boots, day one ========================
# brief B006 (cast extended: big_paulie_plumb, Kearny_Pipefitter)
- id: T047
  category: A
  topic: A5_day_one_tools_boots
  type: question
  trade: plumbing
  author: peteplumb80
  when: mid
  title: "First real paycheck in the apprenticeship. What tools are actually worth buying now?"
  body: "1st year in Local 24, mostly commercial bathrooms so far. Got the tool list at the start and bought the basics. Now I've got a couple real paychecks and I'm tempted to go nuts at the big box store. What did you actually end up using every day in your first year that wasn't on the list? And what's a waste of money until later? I spend enough at Wawa already, trying to be smart about this."
  fact_risk: []
  replies:
    - author: oldsteam_zig
      accepted: true
      body: "Kid, buy what you reach for, and borrow twice before you buy anything else. First year, you want good channel locks in two sizes, a decent tubing cutter, a level that isn't junk, and a headlamp. Anything with a battery can wait until you know what your shop doesn't supply. And put your initials on all of it. Things walk on commercial jobs. That's the job."
    - author: ms_almonte
      body: "First, a good headlamp. Second, knee pads you'll actually wear. Third, a tape measure you like holding. Students always skip the knee pads and regret it by 30. Ask me how I know."
    - author: mbell_wireman
      body: "Different trade, same rule: buy safety glasses you'll actually keep on your face. If they fog or pinch, you'll take them off, and that's when something finds your eye. Spend money there first. Stay safe."
    - author: big_paulie_plumb
      body: "4 yrs in, my biggest waste was a fancy cordless set i bought my first year when the shop already had everything on the trucks. dont do that lol"
    - author: Kearny_Pipefitter
      body: "brother get a decent bucket organizer and stop carrying stuff in your pockets. took me 6 months to learn that one"
    - author: peteplumb80
      body: "Okay so headlamp, knee pads, glasses, initials on everything, and no battery stuff yet. My wallet thanks you guys."

# ----------------------------------------------------------------------------
# brief B084 (cast extended: tnguyen_refrig, HeatwaveOnCall, Passaic_Sparky)
- id: T048
  category: A
  topic: A5_day_one_tools_boots
  type: question
  trade: hvac
  author: Bergen_Ducts
  when: late
  title: "New kid at my shop showed up in running sneakers. What boots do I tell him to get?"
  body: "So we hired a new helper last week... nice kid, 18, straight out of school... and he shows up to a basement in Hackensack in white running sneakers. Boss sent him to buy boots on his lunch and he came back with the cheapest pair in the store, which I get, he doesn't have money yet. I'm two years in so the boss told me to 'help him out.' What do you all tell a brand new guy about boots? Steel toe vs composite, waterproof, do they need to be 8 inch... and is there a budget pair that won't wreck his feet by October? I already bought him a Wawa coffee, I'm not buying him boots lol"
  fact_risk: ["EH (electrical hazard) boot rating", "safety-toe requirements on commercial sites"]
  replies:
    - author: oldsteam_zig
      body: "Waterproof, safety toe, good sole, and comfortable enough that he doesn't take them off at lunch. The cheap ones are fine for a month while he figures out what his feet hate. Then he buys a real pair. Tell him to try them on at the end of the day when his feet are swollen."
    - author: mbell_wireman
      body: "If he'll be anywhere near electrical work, look for the EH (electrical hazard) rating on the label, and check whether your shop or the GC has a site rule on safety toes; commercial sites usually do. Composite toe is lighter and doesn't get as cold in winter. Beyond that, fit matters more than brand. A boot that's half a size wrong ruins a ten-hour day. Stay safe."
    - author: neutral_bar_99
      body: "I'm still in school so I can't speak to brands, but our shop teacher made everybody buy boots the first week and said the same thing about trying them on at the end of the day. I got mine at a store on Route 23 in Wayne. Sorry, I'm over-explaining again, it's a habit."
    - author: ms_almonte
      body: "First, safety toe. Second, a sole that grips a wet basement floor, because that's where he'll live all winter. Third, wool-blend socks, two pairs. Students blame the boot when it's really the cotton socks. Ask me how I know."
    - author: tnguyen_refrig
      body: "waterproof. he will stand in a walk-in drain pan at some point. july or january, doesn't matter, wet feet all day is the worst"
    - author: dahvacnj
      body: "sorry if this is dumb but do the 8 inch ones actually matter or is 6 fine? i got 6 and my ankles are fine so far. thanks in advance"
    - author: peteplumb80
      body: "8 inch if he's on ladders or uneven ground a lot. 6 is fine for bathrooms. That's just what my journeyman told me."
    - author: HeatwaveOnCall
      body: "clifton, under a year in. i got the cheap ones at first like your kid and my feet were destroyed by the end of august. switched to a better pair and it was definately like a different job. tell him to save up for it, it's the first thing worth spending on"
    - author: Passaic_Sparky
      body: "idk why everyone sleeps on insoles. cheap boots plus a good insole gets you through till payday"
    - author: Bergen_Ducts
      body: "This is great... sending him the thread lol. Insoles plus the cheap ones for now, real pair by October... thanks all"

