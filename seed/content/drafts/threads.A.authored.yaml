    - author: mbell_wireman
      accepted: true
      body: |
        Jurisdiction is set by each local and it isn't always obvious from a map, so call the apprenticeship office for the local you think covers Perth Amboy and ask them directly whether you're in their area.

        Whether you can apply to more than one program in the same cycle, and whether it's where you live or where you work that counts, can differ from program to program. Ask each one. Write down who you talked to and when. Stay safe.
    - author: threeway_02
