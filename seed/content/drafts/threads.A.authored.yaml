  title: "perth amboy: which ibew local am i even supposed to apply to"
  body: "33, left delivery driving this summer, helper at a small shop now. i want to apply to the ibew apprenticeship this year. i live in perth amboy. my coworker says 456, a guy at the supply house says i can apply anywhere i want, and someone online said you have to apply where you live. can i apply to two different locals in the same year? does it matter where i live or where i work? appreciate it"
  fact_risk: ["IBEW Local 456 jurisdiction covers Perth Amboy", "applying to multiple locals in one cycle", "residency vs workplace rules"]
