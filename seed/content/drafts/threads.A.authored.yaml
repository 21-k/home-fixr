      body: "Sorry if this is long. For me in 24 it was the test first, then an interview, then a ranked list, and from what I understood the score was some mix of those. I never got a breakdown of exact points. What you can work on: the math for the test (practice it), and having real jobs to talk about in the interview. Ask the local you're applying to whether they explain how they score it. Mine didn't, at least not that I saw."
    - author: chris.plumb
      body: "somerset vo-tech grad, applied, waiting. my foreman says the interview counts more than the test but not sure he really knows. did anybody here ever get a breakdown? also is it the same for hvac"
    - author: mbell_wireman
      body: "I'd rather you ask the program than trust a forum on this. When I went through, the aptitude test got you to the interview, and the interview had a big effect on where you landed. That was a long time ago. Each program sets its own scoring, and they're the only ones who can tell you what's current. Stay safe."
    - author: oldsteam_zig
      body: "Kid, stop trying to game a number. Get good at the work and the number takes care of itself. That's the job."

