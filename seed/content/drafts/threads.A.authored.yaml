  when: mid
  title: "Do my vo-tech shop hours count toward anything after I graduate?"
  body: "In the plumbing program at the Middlesex County vo-tech. We do a lot of shop time, plus I help my uncle on weekends (he jokes I'm basically his foreman now lol, I'm not). Ziggy's been answering my questions on here and he said to ask the people who actually run the programs, which I will, but I want to know what others found. Do the hours in a vo-tech program count toward an apprenticeship or a license later? Or is it just a diploma and a head start?"
