- id: T083
  brief: B147
  category: B
  topic: B3_failed_rough_in
  when: mid
  fact_risk:
    - "replacing a water heater is not 'ordinary maintenance' under the NJ UCC; generally permit work"
    - "some towns handle it under a faster category where work starts before inspection ('minor work')"
    - "gas connection and venting are inspected on a gas water heater swap"
    - "an electric water heater swap is generally also permit work"
  type: question
  trade: plumbing
  author: benplumb79
  title: "Does a like-for-like water heater swap need a permit in NJ?"
  body: |
    Sorry, another one from me. A customer in Manville asked us to swap a 40-gallon gas water heater, same spot, same venting. My boss said "we'll pull a permit" and she acted like we were trying to pad the bill. Her last plumber never pulled one.

    Is a straight swap actually permit work in NJ, or does it count as maintenance? And if it's a permit, who inspects it, the plumbing inspector or someone for the gas? I want to be able to explain it next time instead of just standing there.
  replies:
    - author: codebook_dale
      accepted: true
      body: |
        Not legal advice, and plumbing isn't my subcode, but I can tell you how the UCC generally works. Ordinary maintenance is a short, specific list, and as far as I know replacing a water heater isn't on it. Many construction offices treat a water heater swap as permit work, sometimes under a quicker category where you can start right away and the inspection follows. The gas connection and the venting are part of what gets looked at.

        Call the town's construction office for how they handle it. And your boss is right.
    - author: joe.plumb
      body: "my shop pulls one every time... and customers complain every time lol. we tell them the inspection protects them, not us"
    - author: Kash_sing
      body: |
        Same on the HVAC side with furnace swaps. How I explain it to customers:
        - The permit is about the gas and the venting, not the tank
        - A bad vent on a gas water heater is a carbon monoxide problem
        - It's its own line on the invoice so nobody thinks it's padding
    - author: benplumb79
      body: |
        > a carbon monoxide problem

        That's the line I'll use with customers. Thank you.
    - author: JunctionBoxJunkie
      body: "my uncle swapped his own in hamilton last year and nobody pulled anything. not saying it's right, just saying most people have no idea this is a thing"
    - author: LiveFrontLessons
      body: "does the same go for electric water heaters? since theres no gas or vent"
    - author: codebook_dale
      body: "Generally still permit work as far as I know, and the electrical connection gets looked at. Same answer: ask the local office how they handle it."

