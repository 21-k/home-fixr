- id: T067
  brief: B033
  category: B
  topic: B2_epa608
  when: mid
  fact_risk:
    - "608 must be taken through an EPA-approved certifying organization (EPA keeps a list)"
    - "remote proctoring is offered by some organizations, depending on type"
    - "Type I has different testing rules from the other types"
    - "PTACs count as small appliances (Type I)"
  type: question
  trade: hvac
  author: groundrod_05
  title: "Where do people in the city actually sit for the 608?"
  body: |
    Two years in, non-union electrical shop in the Bronx. We've started doing a lot of PTAC and through-wall unit replacements in apartment buildings, and my boss wants two of us to have the 608 by the end of the year.

    Searching online gets me a hundred sites and I can't tell which ones are legit. Some say online with a webcam, some say you have to go in person. Is there a supply house or a school in the city people use? Or is the online one fine? Appreciate it.
