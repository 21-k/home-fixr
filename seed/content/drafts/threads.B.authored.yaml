  type: question
  trade: electrical
  author: RainDayRestock
  title: "sorry if this is dumb, but what do you call an electrician after 4 years in NJ?"
  body: |
    Sorry if this is a dumb question. About six weeks into my first job as a helper in Brick (non-union). An older guy at my shop says he's a journeyman, the boss is "the contractor," and when I asked what I'll be in 4 years nobody could give me a straight answer. One guy said NJ doesn't have a journeyman license at all, another said it does but nobody bothers.

    So what am I working toward? Is it just the contractor license, or is there something in between? I'd like to know what to keep track of now instead of finding out later.
  replies:
    - author: neutral_bar_99
      body: "I asked my teacher this exact thing last year at the vo-tech. He said the one that matters in NJ is the Electrical Contractor license, because that's the one that pulls permits. He wasn't sure about the journeyman part either, which honestly didn't help me much."
    - author: mbell_wireman
      accepted: true
      body: |
        Good question, not a dumb one.

        In the union you top out as a journeyman wireman, but that's a classification in our agreement, not a state license. On the state side, the license you need to pull permits and run jobs yourself is the Electrical Contractor license, from the Board of Examiners of Electrical Contractors.

