    - author: ms_almonte
      body: |
        First, make sure whoever you test with is an EPA-approved certifying organization. EPA keeps a list; check it before you pay anybody. Second, how the test is given depends on the organization and the type. Some offer remote proctoring, some only do it in person, and Type I has its own rules. Ask them directly what's proctored.

        Plenty of supply houses host test days too. Call the counter at the one your shop already uses.
    - author: peteq75
      body: "sorry to hijack, but does an electrical helper even need it for PTACs? the shop i'm helping at down in Galloway does a few and nobody there has one"
