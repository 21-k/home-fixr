  body: |
    Honestly didn't think I'd be asking this after 22 years. Half my calls down here involve heat pumps now. A lot of the raised houses went all-electric in the Sandy rebuilds, and I've been doing the circuits and handing the customer off to an HVAC guy I've known forever. He's retiring in the spring.

