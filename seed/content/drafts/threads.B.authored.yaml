  author: Passaic_Sparky
  title: "what's actually on the business and law part of the EC exam"
  body: |
    4 years doing service and panel swaps out of little falls. not taking the EC exam tomorrow, i know i need my experience squared away first, but i want to start on the business and law side now since that's the part nobody at my shop can tell me anything about. my boss took his like 20 years ago and says "it's common sense, don't worry about it." idk, that's what people said about every test i ever failed.

    what's on it? nj law stuff like contracts and liens, or general business? open book? anyone take it recently
  replies:
    - author: thiago_sparks
      body: "Honestly when I took mine that part was open book and the trade part was the hard one. Bring the reference book, tab it up, you'll be fine."
    - author: codebook_dale
      accepted: true
      body: |
        I'd be careful with that, Thiago. When I took it, some sections allowed references and some didn't, and I'm sure the format has changed since. The testing company publishes a candidate bulletin that lists what's covered and which references are allowed. That's the only document I'd trust.

        From memory, business and law covered NJ licensing rules, contracts, liens, insurance, payroll and tax basics, and record keeping. Read the bulletin before you buy a single book.
    - author: thiago_sparks
      body: "Fair. Dale's right, that was a long time ago for me. Read the bulletin."
    - author: Kash_sing
      body: |
        Ours on the HVACR side had a business and law section too. What helped me:
        - Read the candidate bulletin first, then buy only the references it lists
        - Practice tabbing the books; if references are allowed, the clock is the real enemy
        - The law part is less common sense than people say, especially liens and contracts
    - author: Passaic_Sparky
      body: "ok so bulletin first, then books. found the bulletin, it's way longer than i expected lol. thanks"

