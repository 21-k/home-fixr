    - author: peteplumb80
      body: "my union school just mentioned these last week, said they're coming into the curriculum. nobody said anything about the 608 though"
    - author: bklyn_arkady
      body: "I'd add the condensate. Most of the problems I've heard about on these are condensate, not refrigerant. Pitch it, trap it if the manual says to, and know where it ends up."
    - author: benplumb79
      body: "Thank you all. So: installing doesn't need it, repairing the sealed side does, and it's cheap enough to get anyway. Signing up for Core and Type I."
    - author: tnguyen_refrig
      body: "do universal. you'll want it the first time somebody hands you a mini split"
