- id: T084
  brief: B154
  category: B
  topic: B3_failed_rough_in
  when: mid
  fact_risk:
    - "NM cable secured within 12 in of a box and at no more than 4.5 ft intervals (NEC 334.30), with exceptions"
    - "stacking two cables under one staple only if the staple is listed for it"
  type: question
  trade: electrical
  author: FirstYearSparky
  title: "Failed rough-in for 'cable not secured.' How close to the box is close enough?"
  body: |
    First year non-union, Denville. Failed the rough on a basement finish today. Inspector circled a bunch of runs and wrote "cable not secured within required distance of box," plus something about stacking cables under one staple. My lead was out sick so I did most of those runs myself, which is great.

    How close does the staple have to be to the box? And is two cables under one staple really a fail, or did I just get a picky inspector? I want to fix it right before Friday.
  replies:
    - author: Bergen_Ducts
      body: "we failed a rough last month too... ours was the duct sealing at the boots, inspector wanted mastic on every joint. same kind of thing?"
    - author: OpenNeutralBlues
      body: "think he means electrical cable not ducts lol. our teacher said 12 inches from the box but idk the exact rule"
    - author: codebook_dale
      accepted: true
      body: |
        For NM cable, the editions I've enforced want it secured within 12 inches of a box and at intervals of no more than 4 1/2 feet after that, with exceptions for things like fishing through finished walls. Check which code edition is in effect for your permit, but that part hasn't changed in a long time.

        On two cables under one staple: it depends on the staple. Some are listed for two cables stacked flat and some aren't. Look at the box they came in. If the listing doesn't allow it, it's a fair write-up.
    - author: mbell_wireman
      body: "Agree with Dale. And since your lead was out: next time, it's fine to ask the shop for someone to look over your runs before the inspector does. A second set of eyes beats a red tag. Stay safe."
    - author: FirstYearSparky
      body: "update: restapled everything closer to the boxes, switched to staples rated for two, passed Friday. thanks Dale and Marcus, learned more from this than the whole week"

