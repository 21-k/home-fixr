- id: T082
  brief: B142
  category: B
  topic: B3_failed_rough_in
  when: early
  fact_risk:
    - "the NJ UCC adopts one set of subcodes statewide; enforcement is local"
    - "permits filed at different times can fall under different code editions (adoption grace period)"
    - "the town's construction official resolves an inspector disagreement"
  type: discussion
  trade: electrical
  author: JerseyTomatoWires
  title: "same drawings, two towns... two different answers on the rough"
  body: |
    4th year in 164. foreman has us on two retail fit-outs right now, one in hackensack and one a couple towns over in paramus. same drawings, same crew, same everything. one inspector passed our rough no problem... the other wrote up the exact thing the first one signed off on. foreman just shrugged and said every town is its own country.

    isn't the code supposed to be the same everywhere in NJ? how does that even happen
  replies:
    - author: codebook_dale
      body: |
        The code is statewide; the UCC adopts one set of subcodes for everybody. The people enforcing it are local, and some sections leave room for judgment, so two good inspectors can read the same sentence differently.

        What I'd do: ask the one who wrote it up for the code section, politely, and bring it to your foreman. If it's a real disagreement, the construction official in that town can sort it out. Also look at the permit dates. Permits filed at different times may not be under the same code edition.
    - author: thiago_sparks
      body: "Honestly that's every week for me down the shore. Every town has its thing. You learn what each one looks at and you do it that way. Not worth the fight unless it's actually wrong."

