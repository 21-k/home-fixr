- id: T089
  brief: NEW-B3
  category: B
  topic: B3_failed_rough_in
  when: late
  fact_risk:
    - "NJ homeowner permit: an owner can pull a permit for work they do themselves on their own owner-occupied single-family home"
    - "a hired contractor pulls the permit under their own license"
    - "a licensee working under a homeowner's permit still carries license exposure"
  type: question
  trade: plumbing
  author: Dev_H
  title: "Homeowner pulled his own permit and wants us to do the work under it"
  body: |
    Started at a new shop a few weeks ago, Gloucester County, service and repipes. Better place, actually sends me to school. Today a homeowner in Washington Township told my boss he'd already pulled the plumbing permit himself to "save money" and just wanted us to do the work. Boss said no and walked away from a decent job.

    Is that a real rule or is my boss being stubborn? Can a homeowner even pull a plumbing permit in NJ? And if he can, why can't a licensed shop just work under it?
  replies:
    - author: rui_t_kearny
      body: "Your boss isn't being stubborn. My father used to say the permit is your name on the job. As I understand it, a homeowner can pull a permit for work on his own single-family house that he lives in, when he's doing the work himself. Once he hires a contractor, the contractor is supposed to pull it under his own license. Working under the homeowner's permit doesn't take your boss's license off the line if something goes wrong."
    - author: codebook_dale
      body: "Not legal advice. That matches how I've seen it handled across the subcodes: the homeowner permit is for a homeowner doing his own work. Call the local construction office if you want it from them; most will explain it in two minutes."
    - author: joyd_plumbing
      body: "What's your actual question, whether to be mad at your boss? Don't be. He just kept his license clean."
    - author: plumbnj77
      body: "brother my old cash shop used to do exactly this lol. one of the reasons i left. good on your boss"
    - author: Dev_H
      body: "Appreciate it. Told my boss what you all said and he laughed and said now you know why I walked."
