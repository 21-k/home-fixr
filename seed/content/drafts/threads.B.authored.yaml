- id: T087
  brief: NEW-B1
  category: B
  topic: B5_nyc_dob_vs_nj
  nyc: true
  when: early
  fact_risk:
    - "NYC gas work must be done by a Licensed Master Plumber or a DOB gas work qualification holder working for one (Local Law 150 of 2016)"
    - "the gas work qualification requires an approved training course; there is more than one level"
    - "time under an LMP counts toward the NYC master license if documented"
    - "NJ has no separate gas card; gas piping runs under the master plumber (or HVACR) license"
  type: question
  trade: plumbing
  author: briplumb87
  title: "Helper in the Bronx: what's the DOB gas qualification and do I need it?"
  body: |
    I'm 34, switched over from warehouse management this spring, and I'm a helper at a small plumbing shop in the Bronx. A lot of our work is gas lines in old multifamily buildings. My foreman keeps saying I'll "need my gas card" before he can let me do more than carry pipe, and that the boss's master license isn't enough on its own.

    What is the gas qualification exactly? Is it a test, a course, both? Can a helper get it, or do you need years first? And is it part of working toward a master plumber license, or totally separate? Trying to figure out what to do first.
  replies:
    - author: bklyn_arkady
      accepted: true
      body: |
        In the city it's different from anything I knew growing up in Jersey. As I understand the current rules, gas work has to be done by a licensed master plumber or by someone working for one who holds a DOB gas work qualification. Getting the qualification means an approved training course, and there's more than one level of it. I won't quote you hours or prerequisites; they've been adjusted since it started, and the DOB's page has the current list.

        It's separate from the master license. The master is years down the road and needs documented experience with affidavits. The gas qualification is what lets you actually work on gas for a licensed master in the meantime. Ask your foreman which course the shop uses.
    - author: bklyn_arkady
      body: "One more thing, since you asked what to do first: the time you're putting in now should count toward the master later if it's under a licensed master and you can document it, as far as I know. Start a log this week. Dates, buildings, who supervised you."
