- id: T072
  brief: B068
  category: B
  topic: B2_epa608
  when: mid
  fact_risk:
    - "knowingly venting refrigerant is illegal under federal (EPA) rules"
    - "refrigerant must be recovered by a 608-certified tech before a system is cut out / disposed of"
  type: tip
  trade: hvac
  author: mbell_wireman
  title: "Don't cut a line set on demo until someone certified has recovered it"
  body: |
    Saw this twice this summer on fit-outs, so I'm posting it for the electrical apprentices.

    You're demoing a space, there's an old split system or a rooftop unit coming out, and someone hands a first-year a pair of cutters and points at the copper. Don't. Unless someone with a 608 has recovered the refrigerant and told you it's done, that line set may still be charged. Cutting it vents refrigerant, which as I understand it is illegal, and at close range it can freeze-burn your hands and face.

    Ask the GC or the HVAC sub, "has this been recovered?" and get a name. It's the same as LOTO: you don't assume it's dead because somebody said it probably is. Glasses and gloves either way. Stay safe.
  replies:
    - author: WiremanFromPiscataway
      body: "appreciate this. i was literally handed cutters for this exact thing on a job in edison last month and the hvac guy yelled before i cut. now i know why"
    - author: codebook_dale
      body: "Agreed. Not legal advice, but the venting rules are federal, so this is the same in every town. On the electrical side, that same demo is where I find abandoned circuits left live in the ceiling. Verify dead before you cut anything, copper or wire."
    - author: ms_almonte
      body: "Adding one for the apprentices: if you're the one who recovered it, tag it with your name and the date. The next person can't see what you did."

