- id: T069
  brief: B045
  category: B
  topic: B1_what_am_i_after_four_years
  when: late
  fact_risk:
    - "the NJ Electrical Contractor license (Board of Examiners of Electrical Contractors) is the one that pulls permits and runs work"
    - "whether NJ has a journeyman-level electrician credential, and what it allows"
    - "'journeyman wireman' is a union classification, not a state license"
