- id: T129
  category: C
  topic: C1_am_i_a_laborer
  brief: new
  type: question
  trade: electrical
  author: JughandleJourneyman
  title: "journeyman has me on the morning wawa run and 'forgets' to pay me back"
  body: "so this is a dumb one... 2nd year in 164, my journeyman has me do the wawa run every morning before we start. coffee, his hoagie for lunch, sometimes for 3 guys. he always says he'll get me back friday... friday never comes lol. it's like $20-30 a week. i like him, he teaches me a lot. do i say something or is this just part of being the apprentice? thanks in advance"
  replies:
    - author: Bergen_Ducts
      body: "the wawa run is tradition... the not paying you back part is not tradition lol. your getting played. $30 a week is real money on an apprentice check"
    - author: joyd_plumbing
      body: "Say something. 'Hey, can you get me back today, I'm short this week.' Said with a smile, on a Friday. And up here it should be QuickChek, but that's another thread."
    - author: hec_does_ac
      body: "lol my first lead owed me like $200 in coffee by christmas lol. finally said something and he paid me in one lump and bought me a pork roll egg and cheese every day for a week. say something"
    - author: mbell_wireman
      body: "Getting coffee is a normal part of being the newest guy on a crew. Paying for it out of your own check isn't. On my crews the apprentice runs and the journeyman pays up front. Suggest that: 'Give me the cash before I go and I'll get everything.' Nobody has to feel called out."
    - author: JughandleJourneyman
      body: "update: did the 'give me the cash first' thing monday... he laughed, handed me a twenty and said 'about time you asked.' thanks everyone"
