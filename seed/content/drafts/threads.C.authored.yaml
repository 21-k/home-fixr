- id: T100
  category: C
  topic: C2_boss_pays_cash
  brief: B125
  type: tip
  trade: hvac
  author: haddad_mech
  title: "From the hiring side: why a paper trail matters more than you think"
  body: |
    Here's what I look for when I hire, and it's not what most young guys expect.

    When someone tells me they have three years of experience and all of it was cash, I usually believe them. But I can't verify it, and on our public jobs everybody goes on certified payroll from day one, so I'm starting them at zero on paper whether I like it or not.

    The applicants who stand out walk in with something I can check: pay stubs or W-2s, a 608 card, a letter from a past employer, a log of jobs with dates and who they worked under. It doesn't have to be fancy. It has to exist.

    If you're getting paid cash right now, start that log tonight. Nobody's coming to build it for you later.
  fact_risk: ["certified payroll on public (prevailing-wage) jobs"]
  replies:
    - author: blowerwheel_91
      body: "Sorry if this is a basic question, but does a log I keep myself count for anything with you, or does it need to be signed by someone? Thanks in advance."
    - author: codebook_dale
      body: |
        Not legal advice, just how I'd look at it: a log you keep yourself helps you remember. A supervisor's signature or a pay stub is something someone else can check. For a license, read what the board actually asks for before you assume either one is enough.
    - author: dahvacnj
      body: "kept every pay stub since school in a folder in the truck. guess i'm doing one thing right"
