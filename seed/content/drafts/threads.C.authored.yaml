- id: T117
  category: C
  topic: C4_safety_near_miss
  brief: B098
  when: late
  type: question
  trade: plumbing
  author: benplumb79
  title: "Felt a tingle in a wet crawlspace in Manville. What do you check before going under a house?"
  body: |
    Crawlspace job in Manville last week, replacing a section of drain under an old ranch. There was an inch of water down there from the storms. The work light was on an extension cord plugged into a garage outlet, no GFCI. Halfway through, the light flickered and I felt a tingle in my hand where I was holding the light and kneeling in the water. I got out right away.

    The cord had a nick in it. I'm fine. My boss said I should have checked the cord, and he's right, but I also had no idea the garage outlet wasn't GFCI protected.

    What do you all do before going into a wet crawlspace? I'd like a routine instead of luck.
  fact_risk: ["GFCI requirements for temporary power", "permit-required confined space determination"]
  replies:
    - author: mbell_wireman
      accepted: true
      body: |
        First: you got out. That was the right call. A tingle in a wet space is a warning, not a nuisance.

        Before any wet crawlspace: GFCI protection at the source, or a portable GFCI at the plug, and test it every time. Inspect the whole cord, end to end. Use lights rated for damp locations. And if there's standing water and anything electrical involved, the job can wait until it's dry. Stay safe.
    - author: benplumb79
      body: "I didn't know portable GFCIs were a thing. Ordering one tonight."
    - author: codebook_dale
      body: "Ground-fault protection for temporary power on a job is a standard requirement, and a garage outlet in an older house may well predate GFCI. Don't assume any outlet in an older house is protected. Test it."
    - author: thiago_sparks
      body: "Honestly after Sandy we did hundreds of crawlspaces down here, and that's the one thing I drilled into every helper. Portable GFCI on every cord, every time. Water under a house is a different job."
    - author: condensate_3way
      body: "sorry dumb q but does a gfci actually stop you from getting shocked, or does it just stop it from killing you lol"
    - author: wchen_controls
      body: "fwiw it doesn't stop the first bit of current. it trips fast enough that it usually isn't dangerous, so you might still feel something. that's why you also fix the cord and stay out of the water"
    - author: CondensateOverflow
      body: "bound brook here, everything flooded that same week. idk how many crawlspaces we've been in since. glad you're ok"
    - author: Kash_sing
      body: |
        Crawlspace routine at my company:
        - Look before you crawl: water, wiring, animals, smell
        - Portable GFCI and a cord you've inspected
        - Someone outside who knows you're in there
        - Phone or radio on you
        - If it smells like sewage or gas, nobody goes in yet
    - author: peteplumb80
      body: "1st year here. Our instructor calls crawlspaces confined spaces 'in spirit.' Not sure that's the official definition, but it stuck with me."
    - author: haddad_mech
      body: |
        Careful with that one. Whether a space counts as a permit-required confined space is a specific determination, and some crawlspaces could qualify depending on the hazards. On our jobs the competent person makes that call. Your instructor's instinct is right, though: treat it with that respect.
    - author: JunctionBoxJunkie
      body: "vo-tech electrical guy here, over-explaining: a nicked cord plus wet ground means you were the path. that's literally what our teacher draws on the board every year. glad you're not the example now"
    - author: benplumb79
      body: |
        > you were the path

        That's a sentence I won't forget anytime soon.
    - author: dhollis61
      body: "your boss is right about the cord. you're right nobody told you about the outlet. both true. now you know"
    - author: SumpPumpSeason
      body: "Every sump call in a finished basement after a storm, I think about this. Appreciate you posting it. Buying a second portable GFCI for the van."
    - author: joyd_plumbing
      body: "You asked what we do. Look first, test the GFCI, tell someone. You know all that now. The thing I'd add: say no when it's not safe yet, even to your boss."
    - author: chris.plumb
      body: "bound brook. foreman made us start carrying portable gfcis after one of our guys got bit last year. didnt think about why until now"
    - author: Dev_H
      body: "Did a flooded crawlspace in Deptford after the August storms. Didn't think twice about the cord. I will now. Appreciate it."
    - author: mbell_wireman
      body: "One more: if you ever take a real shock, even if you feel fine afterward, tell someone and consider getting checked out. Some injuries don't show up right away."
    - author: benplumb79
      body: "Thank you. I hadn't thought about getting checked. I felt fine, but I'll mention it to my doctor anyway."
    - author: matt_the_hvac
      body: "bound brook too, hvac. we had a whole unit on this in school and i still almost did the same thing last month lol. saved this"
    - author: benplumb79
      body: "update: the shop bought portable GFCIs for every truck after I showed my boss this thread. Small win."
