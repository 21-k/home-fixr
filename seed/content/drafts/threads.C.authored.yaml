- id: T115
  category: C
  topic: C4_safety_near_miss
  brief: B071
  type: discussion
  trade: plumbing
  author: big_hector_plumb
  title: "CO meter went off before I hit the bottom of the basement stairs"
  body: |
    service call in a 4-family in union city, water heater "making a smell." basement door was shut. my CO meter started going off before i got to the bottom of the stairs. flue pipe had come apart at the chimney.

    got out, got the tenants out of the first floor, called the gas company from the sidewalk. they shut it down. the super was mad at ME lol.

    4 years in and never had my meter go off like that. how many of you actually carry one, and actually turn it on?
  replies:
    - author: joyd_plumbing
      body: "You did it right. Got out, got people out, called it in. The super being mad is the super's problem. I'm in those buildings every week. Every one of my guys carries a meter, clipped on and turned on, before they open the basement door."
    - author: big_hector_plumb
      body: "turned on before the door is the part. i usually forget to turn mine on till i'm already down there lol. not anymore"
    - author: mbell_wireman
      accepted: true
      body: |
        Glad you're okay. What you did is the right order: get out, get others out, call the utility or 911 from outside, and don't go back in until it's been cleared. A personal CO meter is PPE, same as your glasses. Bump test or check it the way the manufacturer says, so you know it works when you need it. Different trade, same rule. Stay safe.
    - author: Elizabeth.traps
      body: "how often are you supposed to calibrate them? mine came with the job and idk if anyone has ever done it. foreman probably doesn't know either"
    - author: ms_almonte
      body: |
        First, follow the manufacturer's calibration and bump-test schedule. It's in the manual and it's not optional. Second, a cheap meter that works beats an expensive one sitting in the truck. Third, if nobody knows when yours was last checked, assume it hasn't been. Ask me how I know.
    - author: joe.plumb
      body: "we got ours from the shop this summer... nobody told us anything about bump testing. going to ask monday"
    - author: rui_t_kearny
      body: "Scary one. My father had a call like that in Harrison years ago. What I'd tell a young guy: if the meter goes off, open it up, let it air out, and once the meter clears, fix the flue and get on with it."
    - author: oldsteam_zig
      body: |
        Respectfully, Rui, I wouldn't tell a young guy that. Get out first. Let the gas company or the fire department clear the building and find the source. Then you come back. Airing it out and going back to work is how good mechanics end up in the hospital.
    - author: rui_t_kearny
      body: "You're right, Ziggy. I said that wrong. Out first, utility or fire department, then the work. Thanks for catching it."
    - author: ginaj75
      body: "pleasantville. had my meter go off in a crawlspace last winter with no gas appliance anywhere near me. turned out to be the neighbor's generator. you never know"
    - author: codebook_dale
      body: "Not legal advice, just how I'd look at it: once you're allowed back in, make sure the building's CO alarms are there and working. A flue that came apart at the chimney may also mean somebody did work without an inspection. Worth noting on your ticket."
    - author: Kash_sing
      body: |
        What every one of my techs carries on every call:
        - Personal CO meter, on, before entering the basement
        - Combustion analyzer on any fuel-burning work
        - The gas utility's emergency number saved in the phone
        And they're trained to leave first and diagnose second.
    - author: big_paulie_plumb
      body: "north bergen, same kind of buildings. sorry, dumb question, but how did the super blame you? you're the one who found it"
    - author: big_hector_plumb
      body: "he said i 'broke it' when i was looking at it lol. the gas company guy told him it had been off the chimney a while. he shut up after that"
    - author: hec_does_ac
