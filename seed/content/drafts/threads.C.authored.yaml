        not plumbing but my boss in clifton offered the same kind of thing for weekend ac installs. i asked kash about it (he's my mentor on here) and he basically said if it's not on the company's books and insurance, don't. so i didn't. not sure if it's the same for union guys tho, or if it's worse
    - author: peteplumb80
