- id: T107
  category: C
  topic: C3_first_no_heat_winter
  brief: B060
  when: late
  type: question
  trade: hvac
  author: big_ben_tools
  title: "First furnace we fired this fall filled the house with burning smell. When is that normal?"
  body: |
    Doing a co-op this fall with a residential shop in Glassboro, mostly furnace and boiler tune-ups. First furnace we fired today, the house filled up with that burning dust smell and the homeowner freaked out, thought it was a gas leak. My lead stayed calm and talked to her, and it went away after a few minutes.

    How do you tell the difference between the normal first-fire smell and something actually wrong? I don't want to be the guy who says "that's normal" and it isn't.

    edit: asked my lead about the readings. CO in the flue was where he wanted it and zero in the house. makes a lot more sense now.
  fact_risk: ["NJ CO alarm requirements"]
  replies:
    - author: ms_almonte
      accepted: true
      body: |
        Good instinct. First, dust burning off a heat exchanger smells like hot dust and fades in minutes. Second, gas has that rotten-egg smell and that is never normal: you stop, get everyone out, and call the gas utility or 911 from outside. Third, a combustion analyzer and a CO meter answer the question your nose can't. Your lead should be testing every tune-up. Ask him to walk you through the numbers.
    - author: big_ben_tools
      body: "he did test it, i just didn't know what the numbers meant. going to ask him tomorrow"
    - author: hec_does_ac
      body: "So this one time in AC... ok Sewell lol, same thing, lady called the fire department on the first fire of the year. they came, smelled dust, left. better she calls than doesn't"
    - author: Kash_sing
      body: |
        What I tell my techs on fall tune-ups:
        - Tell the homeowner before you fire it that there may be a dust smell for a few minutes
        - Change the filter first so you're not burning off a summer of dust
        - Test CO in the flue and in the living space, and write the numbers on the ticket
    - author: epa60812_2
      body: "brother we had the same thing in paterson last week. my lead opened a window and just talked to her the whole time. that's half the job i think"
    - author: codebook_dale
      body: "One more: ask whether the house has working CO alarms. Not legal advice, but NJ has CO alarm requirements for many homes, and a startup call is a good time to make sure theirs actually work."
    - author: ExRetail_NowHVAC
      body: "First week at my new job and we did tune-ups every day. Telling them about the smell before you fire it saved me from this exact situation twice already."
    - author: dhollis61
      body: "your nose is a tool. the meter is the answer. trust the meter and you sleep fine"
