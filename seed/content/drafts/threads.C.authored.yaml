- id: T112
  category: C
  topic: C3_first_no_heat_winter
  brief: new
  when: late
  type: tip
  trade: plumbing
  author: oldsteam_zig
  title: "Last week of September: what I want my helpers doing before the phones start"
  body: |
    Every year the last week of September is the calm before the phones. Here's what I tell my helpers.

    Stock your truck like it's January. Fittings for the old stuff, not just the new stuff. Nipples, unions, gauge glasses, pigtails, a couple of the controls we always end up needing.

    Know where every shutoff is on your regular customers' boilers before it's dark at five.

    Test your flashlight, your CO meter, your combustion analyzer. Get your boots resoled now, not the first wet week.

    And sleep. On-call season is long, kid. The guy who's rested at 2am does better work than the guy who's been up since Tuesday. That's the job.
  replies:
    - author: sweatjoint200amp
      body: "the boots one... mine already have a hole in them. ordering new ones tonight. thanks zig"
    - author: joyd_plumbing
      body: |
        I'd add one, Ziggy, and push back on one. Add: update your customers' contact info now, half my building supers changed this year. Push back: don't stock every control on every truck. Two on the lead truck is plenty. The rest is money sitting on a shelf.
    - author: oldsteam_zig
      body: "Fair. My trucks, my bad habit. Two on the lead truck it is. Don't tell my guys I said that."
    - author: Exit117Plumber
      body: "My uncle's truck is a disaster right now. Sending him this. He's going to pretend he didn't read it."
    - author: rui_t_kearny
      body: "My father used to say the truck tells the customer who you are before you open your mouth. He was right, and mine still doesn't look like his did."
