- id: T114
  category: C
  topic: C4_safety_near_miss
  brief: B030
  when: early
  type: question
  trade: plumbing
  author: BackflowBlues
  title: "got dizzy pulling galvanized out of an attic in the heat. foreman was mad i didn't say something"
  body: |
    demo day on an old cape in hamilton, like 97 out. foreman had me pulling old galvanized out of the attic for a bathroom reno. after maybe an hour i got dizzy and noticed i'd stopped sweating, which i thought was a good thing lol. foreman made me sit in the truck with the ac on and drink water. felt fine after a while.

    he was mad i didn't say something sooner. was it actually a big deal or is he overreacting
  replies:
    - author: mbell_wireman
      body: |
        Your foreman is right, and he may have done you a real favor. Dizziness and stopping sweating in that kind of heat are warning signs of heat illness, and it can get serious fast. Next time: water before you're thirsty, breaks out of the attic, and tell someone the moment you feel off. If someone gets confused or stops sweating, that's a call for medical help, not a break.
    - author: tnguyen_refrig
      body: "stopping sweating is not good lol. it's bad. watched a guy go down in a condenser room on the boardwalk one july. your foreman did the right thing. listen to him"
    - author: Kash_sing
      body: |
        What we do on summer attic days:
        - Attic work first thing in the morning, done before 11 if possible
        - Two people, one stays where he can see the other
        - Water and electrolytes in the truck, not "I'll grab something later"
        - Anyone can stop the job if they feel off, no questions asked
    - author: big_nicole_plumb
      body: "not to scare you but this happened to me my first july in burlington. went home thinking i was fine and felt terrible for two days. say something early. edit: early, not after"
    - author: ThirdYearTinknocker
      body: "3rd summer in attics. the thing nobody tells you is drink water the night before too. appreciate this thread, sending it to our new guy"
