- id: T091
  category: C
  topic: C1_am_i_a_laborer
  brief: B023
  when: late
  type: question
  trade: electrical
  author: OpenNeutralBlues
  title: "Senior-year co-op has me sweeping and doing the Wawa run. Ask the school to move me?"
  body: |
    Vo-tech senior in Essex County, electrical. Our co-op started in September, I'm placed with a small contractor in Nutley three afternoons a week. So far it's been sweeping, carrying boxes of fittings up from the van and going to Wawa for the guys. Two weeks of that.

    My shop teacher said if the placement is bad we can ask to switch. I don't want to look like I'm complaining. Is two weeks too early to say something?
  replies:
    - author: haddad_mech
      body: |
        I've taken co-op students. Here's what I look for: does the kid ask what we're doing tomorrow. Before you go to the school, ask your lead that, and ask to carry the tools for that task, not just the material. If it's still only sweeping in a month, then talk to your co-op coordinator. They'd rather move you than lose you.
    - author: groundrod_05
      body: "Apex grad. Did basically the same thing in the Bronx for my first few months. Two weeks is early. Give it a few more before you burn the placement."
    - author: auelecny
      body: "brother i'm 35 and i swept for 3 months when i switched. idk if that makes you feel better or worse"
    - author: threeway_02
      body: "Career switcher, about six weeks into my first helper job. My lead told me the sweeping is where you learn where everything goes in a house. He wasn't wrong. I can find a panel in a split-level in about ten seconds now."
    - author: dhollis61
      body: "wawa runs and sweeping are how everybody starts. ask one question a day. two weeks is too early to call it"
