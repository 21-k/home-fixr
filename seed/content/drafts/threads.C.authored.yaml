- id: T126
  category: C
  topic: C5_commute_tolls_parking
  brief: new
  nyc: true
  when: late
  type: tip
  trade: electrical
  author: dreb_jman
  title: "For the Jersey guys walking onto my Midtown job late: tunnels, PATH, and DOB inspection days"
  body: |
    Brother, this is for the Jersey guys I keep watching walk in at 6:58 with a coffee from the tunnel line.

    One: leave earlier than you think. The Lincoln on a random Tuesday will eat 40 minutes for no reason.

    Two: the PATH or the bus plus a walk beats driving unless the company pays the garage, and most don't.

    Three: on inspection days, the inspector sees your area before he sees your work. Clean, covers on, panels labeled, no open boxes you can't explain. In my experience an inspector who walks into a mess starts looking harder. I've watched good work get picked apart because the floor looked like a dumpster.

    Get in early on inspection day. That's all I've got.
  fact_risk: ["NYC DOB electrical inspection practices on high-rise jobs"]
  replies:
    - author: hudson_conduit
      body: "union city, i can see the helix from my window and on days the shop sends me into the city i still leave at 5. the lincoln is a coin flip every morning lol"
    - author: bklyn_arkady
      body: "In the city it's different from Jersey on inspection day too: more people walking the job, more paperwork on the wall. Same rule as yours though. A clean area buys you patience."
    - author: mbell_wireman
      body: "Same on the Jersey side. Inspection day is also a safety day: covers on, nothing energized left open, everyone in their PPE. An inspector notices a crew that works safe."
    - author: groundrod_05
      body: "Took your gang box advice from my Midtown thread over the summer. Now it's the inspection day advice. Appreciate it."
    - author: JughandleJourneyman
      body: "164 guy, not in the city... but my cousin's in 3 and commutes from teaneck. he says the same thing, the bus beats driving most days... and a wawa stop is not an option lol"
    - author: dreb_jman
      body: "Your cousin's right. The bus and a walk beat sitting in the helix with your engine running, every time."
