- id: T093
  category: C
  topic: C1_am_i_a_laborer
  brief: B087
  when: late
  type: question
  trade: electrical
  author: neutral_bar_99
  title: "Saturday helper job is all carrying, and my parents want me doing SAT prep instead"
  body: |
    I'll try to give the full picture. I'm in the electrical program at the Passaic County vo-tech, senior year. All summer and now on Saturdays I've been helping a residential electrician out of Wayne. It's mostly carrying, sweeping, holding the ladder, and the occasional Wawa run. I like it anyway, and he's a good guy.

    My parents want college. They say if I'm "just carrying boxes" I should quit and spend Saturdays on SAT prep instead. Part of me thinks they have a point, because I'm honestly not learning a lot of electrical yet.

    Is carrying boxes at 16 worth anything? Or am I wasting time I could use on school?
  fact_risk: ["rules on what minors may do on job sites", "apprenticeship diploma/algebra requirements"]
  replies:
    - author: oldsteam_zig
      body: |
        Kid, your parents aren't wrong that school matters, and you're not wrong that the job matters. Every one of us started carrying. Don't quit because it's carrying. Quit if he's not teaching you anything when you ask.
    - author: JerseyTomatoWires
      body: "carrying is how they find out if you show up... you showing up on saturdays at 16 is already more than most people do"
    - author: bklyn_arkady
      body: |
        In the city it's different with summer helpers, and I'd guess Jersey has its own rules too: there are limits on what a minor is allowed to do on a job, and insurance has opinions. So it may not be him holding you back. Ask him what he's allowed to let you do at your age.
    - author: neutral_bar_99
      body: "That's a good point I hadn't considered. He did say something about insurance once and I thought he was just saying it. I'll ask him next Saturday."
    - author: LiveFrontLessons
      body: "vo-tech grad here. the summer job i had before senior year is honestly why i got hired out of school, the boss called my summer guy. so it counts even if its sweeping"
    - author: plumbguy917
      body: "my parents wanted college too lol. now i'm in Local 1 and my mom tells everyone at church about it. they come around"
    - author: WiremanFromPiscataway
      body: "for what it's worth i did college and then switched at 33. not saying don't go, just saying the trade will still be here. appreciate you asking this, wish i had at your age"
    - author: mbell_wireman
      accepted: true
      body: |
        Talk to your parents with facts. Most apprenticeship programs I know of want a high school diploma and solid algebra, and they look at your grades, so school is part of this plan, not against it. Show them you know that. Then keep the Saturday job if you can keep your grades up.

        And whatever you're doing on site, glasses and boots every time, even for sweeping. Stay safe.
    - author: neutral_bar_99
      body: "Thank you. I'm going to show my parents this thread, which may or may not help my case."
    - author: oldsteam_zig
      body: "Show them the part about keeping your grades up, kid. That's the part parents read."
    - author: JunctionBoxJunkie
      body: "same situation in hamilton except my dad's a plumber and STILL wants me to go to college lol. you're not alone"
    - author: neutral_bar_99
      body: |
        update: kept the job. Parents agreed as long as my grades stay where they are. He let me make up whips for two condenser disconnects last Saturday (nothing live, and he checked every one). Small thing but it felt huge.
