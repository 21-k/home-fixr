- id: T106
  category: C
  topic: C3_first_no_heat_winter
  brief: B052
  when: late
  type: question
  trade: plumbing
  author: chris.plumb
  title: "first cold night and the phones blew up. what do you check on a boiler that sat all summer"
  body: "first night in the 40s and our board went crazy, 11 no-heat calls before noon. foreman sent me out with a journeyman on 4 of them. two were the thermostat. what else is usually wrong on startup week? and is there a order you guys go in or is it just experience. bound brook, mostly hot water boilers and some steam"
  replies:
    - author: Kash_sing
      accepted: true
      body: |
        Fall startup calls we see every year around now:
        - Thermostat batteries died over the summer, or it's still set to cool
        - Service switch got turned off for the summer
        - Pilot out on older standing-pilot boilers
        - Low pressure on hot water systems nobody looked at since spring
        - Circulator stuck after sitting all summer
        Check the simple things first, in that order, and do a combustion and CO check before you leave. A callback on startup week costs more than the call.
    - author: chris.plumb
      body: "the thermostat one got us twice today lol. foreman said the same, check the stat before you open anything"
    - author: Exit117Plumber
      body: "Ziggy told me basically the same thing in another thread, simple stuff first. My uncle's phone hasn't stopped ringing all week either."
    - author: Dev_H
      body: "Circulators. Two stuck ones this week, one in Deptford and one in Woodbury. Appreciate the list."
    - author: JunctionBoxJunkie
      body: |
        electrical side but over-explaining as usual: my teacher says half the no-heat calls his old shop in hamilton ran were a tripped breaker or a service switch somebody flipped thinking it was a light. so check that too before anyone opens the boiler
