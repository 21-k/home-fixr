      body: "egg harbor brother, residential hvac 1 yr. never touched refrigeration. is it worth asking even with zero commercial experience?"
    - author: tnguyen_refrig
      body: "yes. nobody down here had commercial experience before somebody gave them some. have your 608, show up on time, don't be scared of the cold"
    - author: hec_does_ac
      body: "tnguyen's right... I did casino chillers in AC for years and the winters were where I actually learned the big stuff. summers you just survive lol"
