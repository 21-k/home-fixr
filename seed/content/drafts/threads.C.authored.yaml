    - author: Exit145Electric
      body: |
        > Your work will talk louder

        appreciate it. yeah i think i'm mostly worried the new guy hears something before i even start
    - author: thiago_sparks
      body: "Honestly in a small state the new owner already called somebody about you before he made the offer. If he'd heard anything bad, you wouldn't have the offer."
    - author: WawaRunWired
      body: "also bergen, also a small shop. how did you even bring up leaving? asking for a friend (me). sorry if thats off topic"
    - author: Exit145Electric
