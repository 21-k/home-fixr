    - author: dhollis61
      body: "ask the hall. then do what they say. never needed the saturday money that bad in thirty years"
    - author: BergenPlumber
      body: |
        > never needed the saturday money that bad

        fair. i'm not desperate, just tempted. he's a good guy, that's the hard part
    - author: joyd_plumbing
      body: "What's your actual question: is it legal, or how do you say no to a guy you like? The second one's easier than you think. 'Can't, I've got stuff Saturdays.' He'll ask somebody else."
    - author: Exit145Electric
      body: "i do side work for cash all the time, nobody cares. just dont tell anyone lol"
    - author: codebook_dale
      body: "Respectfully, 'nobody cares' is what everyone says until something goes wrong. I'd rather he hear it here than from an insurance adjuster."
    - author: PlumbFromMorris
      body: "4th year in 24. sorry, not trying to pile on, but a guy a couple years ahead of me did weekends with a foreman and when one of those jobs leaked, guess who got blamed. not the foreman."
    - author: thiago_sparks
      body: "That's the part people miss. When something goes wrong, the helper is the easiest one to point at."
    - author: oldsteam_zig
      body: "And a foreman who's good to you on the job doesn't stop being your foreman on Saturday. Say no nicely and he'll respect it. That's the job."
    - author: BergenPlumber
      body: "update: asked the steward, quietly. he pointed me to the part of the agreement that covers it and told me to read it myself. read it. not doing it. told my foreman i'm busy saturdays, he said no problem and moved on. thanks everyone"
