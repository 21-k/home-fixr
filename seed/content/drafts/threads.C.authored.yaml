- id: T119
  category: C
  topic: C4_safety_near_miss
  brief: new
  when: mid
  type: tip
  trade: hvac
  author: hec_does_ac
  title: "Heat wave week: 14 no-cool calls in two days and what I keep telling new techs"
  body: |
    So this one time in AC... ok it's this week, not one time lol. 14 no-cool calls Monday and Tuesday between Cherry Hill and Washington Township. Half were dirty filters and clogged condensate lines, a couple capacitors, one frozen coil the homeowner "fixed" by turning the thermostat down to 60.

    What I keep telling my new guys on ride-alongs... check airflow before you even think about the charge. Check the condensate before you blame the unit. Drink water in the truck between every call, not when you're already dizzy. And if the attic is an oven, do the attic part first thing in the morning and come down for air often. Nobody gets a medal for passing out over an air handler.

    What are you guys seeing this week?
  replies:
    - author: tnguyen_refrig
      body: "walk-ins down here. every restaurant on the boardwalk calls at 4pm on a saturday when the box hits 50. dirty condensers, every one. winter is when you learn, summer is when you survive"
    - author: epa60812_2
      body: "first summer brother... 3 frozen coils this week in paterson, all filters. my lead makes me check airflow first every single time now"
    - author: Kash_sing
      body: |
        Same here in Middlesex. What I'd add for the new techs:
        - Write down what you found, even on the easy calls; patterns show up
        - Don't promise same-day on a part you don't have on the truck
        - Heat-wave callbacks cost more than the calls did
    - author: hec_does_ac
      body: "Kash with the callbacks lol. he's right though... the heat wave callback is the one that eats your saturday"
    - author: dahvacnj
      body: "toms river. capacitors and clogged drains all week. drank like 6 waters yesterday and still got a headache. thanks for the reminder"
    - author: Dev.R
      body: "pemberton, running calls solo this summer. the come down for air thing, my shop doesn't really do that. should i bring it up? thanks in advance"
    - author: hec_does_ac
      body: "Bring it up... nicely lol. Say you want to go up with someone and take turns. Most bosses say yes when you put it that way"
    - author: hector.hvac
      body: "lakewood, first summer. the thermostat down to 60 thing happened on literally our first call monday lol. is that why the coil freezes or is it the filter mostly?"

