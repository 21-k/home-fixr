- id: T092
  category: C
  topic: C1_am_i_a_laborer
  brief: B082
  type: question
  trade: plumbing
  author: BergenPlumber
  title: "3rd year and still running material while the 1st years hang pipe"
  body: "3rd year in 24. on a big commercial job in hackensack, and the foreman has me on material and fire watch while two first years are cutting in hangers and risers. is it because he thinks i'm good at material? do i ask him or go to the steward? don't want to make it a thing. thanks in advance"
  replies:
    - author: oldsteam_zig
      body: |
        Ask the foreman first, kid, not the steward. The steward is for when it's a problem, and this isn't a problem yet. Some foremen keep the reliable guy on material because he's reliable. Tell him you want time on the pipe before you top out. That's the job, but you can still say something.
    - author: haddad_mech
      body: "From the contractor side: the foreman may not even have noticed. Big jobs have a lot going on. Ask for something specific, like 'can I get on the risers next week,' and he'll probably say yes."
