# ===================== C1. Am I being used as a laborer? ===================
- id: T090
  category: C
  topic: C1_am_i_a_laborer
  brief: B005
  when: late
  type: question
  trade: electrical
  author: JerseyTomatoWires
  title: "My first-year thinks he's just a laborer. How do I tell him what's normal?"
  body: |
    4th year in 164. foreman paired me with a first-year on a warehouse fit-out in secaucus about 2 months ago... good kid, shows up, doesn't complain on the job. but at lunch he told me he thinks he's being used as a laborer. material, gang box, sweeping, fire watch. he's thinking about quiting.

    problem is i half agree with him. i don't want to lie and say it's all fine. i also don't want to go over the foreman's head for him.

    what do i actually tell him... what's normal at 2 months and what isn't? and is it my place to say something to the foreman? appreciate it
  replies:
    - author: oldsteam_zig
      body: |
        Tell him the truth, kid. The first months are carrying stuff, and the way out is being good at carrying stuff. He knows where everything is, has the next thing in his hand before the journeyman asks.

        Then tell him the other truth: if it's still only material at a year, he should say something. Different trade, same job.
    - author: haddad_mech
      accepted: true
      body: |
        Here's what I look for when I hire, and what I'd want a 4th year doing for my first-years: give him one real task a day that you can check. Pull a run, terminate a row of devices, label a panel schedule. Then tell the foreman what he did right, by name.

        You're not going over anyone's head. You're vouching for him. Foremen move the first-years somebody vouches for.
    - author: JerseyTomatoWires
      body: |
        > give him one real task a day that you can check

        that part i can actually do... foreman lets me run my own little area so i can hand him stuff
    - author: joyd_plumbing
      body: "What's your actual question? How to talk to him, or whether to talk to the foreman? Talk to him first. When you go to the foreman, go to say he's ready for more, not to complain for him."
    - author: big_paulie_plumb
      body: "my first year i would've killed for a 4th year who even noticed me lol. sorry, not super helpful, but the fact you're asking means he's lucky"
    - author: dreb_jman
      body: |
        Brother, half my first-years think they're laborers because the job is a tower and they're on the material hoist all week. Tell him a building gets built in order. Right now the order is material. In two months it's pipe and wire. That's how big jobs go.
    - author: TwistAndTape
      body: "2nd year in 164 and i was the gang box guy for like 5 months on my first job lol. then one day the journeyman handed me the bender and never took it back"
    - author: thiago_sparks
      body: |
        Honestly the union side and the small-shop side look different here. In a shop like mine a first-year is doing real work by week three because there's nobody else. On a big job you can sit in material for months. Neither one is wrong, but he should know that's the trade-off he picked.
    - author: rui_t_kearny
      body: "My father used to say the apprentice who complains at the lunch table is still learning, the one who complains to the foreman is gone. Tell him to bring it to you, not the table. Lunch table talk travels."
    - author: Kearny_Pipefitter
      body: "I was that guy a few weeks ago, plumbing side. What helped was someone telling me the actual red flags instead of just 'it's normal.' Then I asked for something specific and got it."
    - author: JerseyTomatoWires
      body: "ok so what are the red flags, straight up? so i can tell him something real and not just 'hang in there'"
    - author: oldsteam_zig
      body: |
        Nobody explains anything even when he asks. Still nothing but material at a year. Paid off the books. No talk about school. He's in the Local, so school and paper are handled. That leaves the first two. At two months, neither one is true yet from what you're saying.
    - author: codebook_dale
      body: "From the inspection side: have him walk with you when the inspector comes through. A first-year who hears why something passes or fails learns more in twenty minutes than in a week of material runs."
    - author: hudson_conduit
      body: "lol at 'used as a laborer.' we're all laborers until someone trusts us with something. the trick is not acting like it's beneath you"
    - author: joyd_plumbing
      body: "Mostly agree with hudson. But if he's asking, he cares. Don't make him feel dumb for asking. That's how you lose the good ones."
    - author: Exit145Electric
      body: "sounds like your foreman is the problem tbh. i'd tell him to find a different shop that actually lets him work"
    - author: JerseyTomatoWires
      body: "he's not at a shop... we're both in the local, he can't just switch shops lol. but i get what you mean"
    - author: sweatjoint200amp
      body: "first-year here (plumbing, 5 months)... honestly just hearing a 4th year say 'this is normal and here's when it isn't' would help me more than anything. tell him what you'd want to hear"
    - author: haddad_mech
      body: "One more, since you'll top out soon: this is part of the job now. Teaching the first-year is what makes a good journeyman. Foremen notice who the first-years want to work with."
    - author: JerseyTomatoWires
      body: |
        update: told him basically what Haddad and Ziggy said, the red flags and the one-task thing. had him terminate a whole row of receptacles yesterday and i checked every one with him. foreman walked by and saw. kid was smiling at lunch for once... appreciate everybody
