    - author: haddad_mech
      body: "That's how it should be done. In person, early, short. The 'ok' and walking out is his problem, not yours. I've had people leave my company exactly that way, and I've hired two of them back since."
    - author: mbell_wireman
      body: |
        Something nobody's mentioned: crawlspaces are a safety job, and a bad two weeks is when people rush. GFCI on your cords, check what's live before you go in, lock out what you're working on, and don't let being angry make you careless. Stay safe.
