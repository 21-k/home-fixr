- id: T183
  brief: B079
  category: E
  topic: E1_sweat_vs_press
  type: question
  trade: hvac
  when: mid
  author: middlesex_coils
  title: "mini-split flare connection leaking on a brand new install"
  fact_risk: ["flare nut torque per manufacturer spec", "no thread sealant on flare faces", "nitrogen pressure test and micron-gauge vacuum decay test"]
  body: |
    apologies if this is basic. we installed a single zone mini-split in a split-level in woodbridge last week. pulled a vacuum, it held for a few minutes, released the refrigerant, and two days later the customer says it's blowing warm. my lead found the liquid line flare at the indoor head leaking. i made that flare. what usually causes a flare to leak, and how do you know a flare is good before you tighten it? i would like to stop guessing on these.
  replies:
    - author: Kash_sing
      accepted: true
      body: |
        Flare leaks are almost always one of these:
        - Cut not square, or not deburred (or deburred so hard the wall got thin)
        - Flare nut not on the pipe before you flared it (everyone does it once)
        - Wrong flare size, or an off-center flare from a worn tool
        - Not torqued to the manufacturer's spec. Too loose leaks, too tight cracks the flare
        - Dirt or a scratch on the flare face

        Before you tighten it, look at it: smooth, even, no cracks, sits flat on the cone. Torque wrench and the number from the install manual. Then a nitrogen pressure test and a vacuum on a micron gauge, held long enough to mean something. A few minutes isn't a decay test.

        A callback like this eats the margin on the whole install, so it's worth getting right.
    - author: rui_t_kearny
      body: |
        Plumber here, so take it for what it's worth. My father used to say a flare is a sealing face, not a thread joint. Don't put pipe dope or tape anywhere near it. I watched a guy do that on a gas flare once and I'm still mad about it.
    - author: tnguyen_refrig
      body: |
        torque wrench. every time. the guys who do flares by feel in july are the ones i see again in august. if you have to redo one, cut it off and flare it fresh, don't just crank it tighter and hope

