- id: T212
  brief: B151
  category: E
  topic: E8_oil_to_gas
  type: question
  trade: plumbing
  when: late
  author: EssexPipes
  title: "Sizing gas pipe for a conversion: why does everyone talk about the longest run?"
  fact_risk: ["longest-length method for gas pipe sizing (fuel gas code tables)", "CSST bonding requirements", "pressure test and inspection before utility turn-on"]
  body: |
    2 years in, Bloomfield. We're doing a bunch of oil to gas conversions this fall and I'm finally being let near the gas piping, carrying and cutting at least. My journeyman sized the pipe for a house with a boiler, a water heater and a range and kept saying "the longest run" and "total BTU." Why the longest run and not each run on its own? And why does it matter if the pipe's a little small, the gas still gets there right?

    Not planning on doing any of this myself. I just want to understand it before somebody quizzes me on the job.
  replies:
    - author: joyd_plumbing
      accepted: true
      body: |
        What's your actual question? Two, I count.

        Why it matters: undersized pipe means not enough gas reaches the appliance when everything runs at once. The burner runs starved, burns badly, and can make carbon monoxide. "Gets there" isn't enough. It has to get there at the right pressure.

        Why the longest run: the common method in the code tables sizes every section using the total length from the meter to the farthest appliance, and the BTU load that section carries. It's conservative on purpose. Your journeyman reads the table for that gas pressure and pipe material.

        He does the sizing, the master signs for it, the inspector checks it, and it gets tested before the utility turns anything on.
    - author: oldsteam_zig
      body: |
        And the load is the input rating off each appliance's nameplate, not a guess. Add them up and think about what they might add later, a dryer, a generator. Cheaper to run it right once, kid.
    - author: dhollis61
      body: |
        use the table for your pressure and material. test it. get it inspected. don't light anything that wasn't tested.
    - author: epa60812_2
      body: |
        brother hvac helper in paterson here. we see undersized gas on furnace calls all the time, burner looks lazy and yellow. now i know why
    - author: hudson_conduit
      body: |
        electrical guy here but the yellow flexible gas pipe needs to get bonded right? our shop got called about that on a conversion lol
    - author: Kash_sing
      body: |
        Yes. CSST comes with its own bonding instructions, the code has a say too, and it matters mostly because of lightning. It gets bonded the way the manufacturer and your local code say. Nobody should be making that one up on site.
    - author: OpenNeutralBlues
      body: |
        Our shop teacher mentioned bonding that yellow gas tubing last week. Didn't understand why until this thread.

