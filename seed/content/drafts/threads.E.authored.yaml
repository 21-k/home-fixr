- id: T180
  brief: B118
  category: E
  topic: E1_sweat_vs_press
  type: tip
  trade: plumbing
  when: late
  author: oldsteam_zig
  title: "Torch work in old houses: stick around after you put the torch down"
  body: |
    Had a helper sweat a couple of fittings on a boiler near a joist bay in Lodi last week. Nice joints. We packed up, I went back down for a tool I forgot, and I smelled it before I saw it. The old wood and the dust up in that bay had been smoldering the whole time.

    Nobody got hurt and the house is fine. But here's what everybody on my trucks does now, and what I should have made him do:

    Fire cloth behind the joint before you light the torch, not after. Wet down old framing if it's dry as paper. Spray bottle and an extinguisher on the floor next to you, not out on the truck. And when you're done, stay and watch it for half an hour. Put your hand near the wood. Look up into the bay with a light.

    Old balloon-frame houses in Bergen have bays that run open floor to floor. A spark goes up there and you won't see it until it's a real problem.

    Thirty minutes of watching is cheap. That's the job.
  replies:
    - author: EssexPipes
      body: |
        Good one. What kind of fire cloth do you guys actually use, the cheap felt ones from the supply house or the pricier ones? And do you wet the wood every single time or only when it's old?
    - author: joyd_plumbing
      body: |
        The felt ones are fine for half inch and three quarter copper if you keep them in good shape. I spray old wood every time, it costs nothing. And check the other side of the wall. Hoboken brownstones share party walls, and the smoke shows up in the neighbor's place first.
    - author: ms_almonte
      body: |
        First thing I teach before anyone touches a torch: know where the extinguisher is and what's on the other side of the wall. Second: you're not done when the joint is done. Students hate the waiting part. Ask me how I know it matters.

