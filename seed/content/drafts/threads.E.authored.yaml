- id: T187
  brief: B001
  category: E
  topic: E2_three_way_switch
  type: question
  trade: electrical
  when: late
  author: leadfree98
  title: "swapped one hallway switch and now the light only works from one end"
  body: |
    plumbing guy here so go easy. my mom's hallway in long branch has a light switch at both ends. one switch was cracked so I bought a new one at the hardware store, breaker off, swapped it wire for wire (I thought). now the light only works from the new switch when the other one is in one position, and sometimes not at all. did I buy the wrong switch or wire it wrong? idk why it would care which screw. also is this a call-an-electrician thing at this point

    edit: it was the dark screw thing. thanks
  replies:
    - author: thiago_sparks
      body: |
        Honestly this is the most common 3-way mistake there is, don't feel bad. A 3-way has one darker screw (the common) and two lighter ones (the travelers). Your new switch probably has the common in a different spot than the old one, so the wire that was on the old common ended up on a traveler screw. Breaker off, verify dead with a tester, then find that wire. If you didn't mark it, that's where it gets harder. If the wiring is cloth or crumbly, stop and call someone. Long Branch has plenty of hallways like that.
    - author: codebook_dale
      body: |
        To your second question: if you can't sort it out with the power off and a tester, that's the point to call an electrician. Next time, put a piece of tape on the wire from the dark screw before anything comes off.
    - author: Dev_H
      body: |
        same thing happened to me in my apartment in deptford. it was the common. took me an hour. appreciate it, learned something too

