- id: T182
  brief: B059
  category: E
  topic: E1_sweat_vs_press
  type: question
  trade: hvac
  when: mid
  author: DinerCoffeeHVAC
  title: "Why does my lead flow nitrogen when we braze linesets?"
  fact_risk: ["flowing nitrogen while brazing to prevent internal oxide scale"]
  body: |
    Sorry if this is a dumb one. Doing a lot of AC changeouts in Bayonne and JC this summer. Every time we braze the lineset my lead hooks up the nitrogen bottle with a regulator and has a little flow going through the pipe while I braze. He told me "so you don't make crud" and walked off. What crud? In school we just brazed. Is this actually a big deal or is it one of those things one guy does?
  replies:
    - author: hec_does_ac
      body: |
        Not a one-guy thing... it's a big deal lol. Copper heated with air inside it grows black oxide scale on the inside wall. Later that scale flakes off and goes where you don't want it: the metering device, the screens, the compressor oil. A low flow of nitrogen pushes the oxygen out so the inside stays clean. So this one time in AC I cut open a line on a casino job where nobody flowed nitrogen and it looked like the inside of a chimney. Low flow, through a regulator, just enough to feel on your hand.
    - author: oldsteam_zig
      body: |
        Plumber's side of it, kid: on water we sweat with soft solder and nobody cares about a little oxide inside. Refrigerant is brazed and the system is sealed, so whatever's inside stays inside forever. Different animal. Listen to your lead on this one.

