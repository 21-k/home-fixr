- id: T195
  brief: B166
  category: E
  topic: E3_afci_nuisance
  type: question
  trade: electrical
  when: early
  author: JunctionBoxJunkie
  title: "how does an AFCI actually tell a bad arc from a light switch?"
  fact_risk: ["how combination AFCIs detect series and parallel arcing"]
  body: |
    ok so last year in class we covered AFCIs and the teacher said they detect "dangerous arcing." but every time you flip a switch or plug something in there's a little arc, and a brushed motor like a drill arcs constantly. so how does the breaker know which arc is the bad one? is it just guessing off some pattern? because from what I hear on here they trip on random stuff and miss other stuff, so I'm skeptical. also the teacher couldn't really answer it so here I am
  replies:
    - author: codebook_dale
      body: |
        Good question, and the skepticism is reasonable. In plain terms: the breaker has electronics that watch the current waveform for the signature of a dangerous arc, the erratic high-frequency noise and the pattern a loose or damaged conductor makes over time, as opposed to the brief, predictable arc of a switch or the steady noise of a motor. Combination types look for arcing in series, like a loose connection, and from line to neutral or ground, like damaged insulation. Many also sense ground faults.

        It is pattern recognition, so it isn't perfect. Some motors and electronics look suspicious to some models. That's part of why the designs keep getting updated.
    - author: benplumb79
      body: |
        Plumbing guy, but that was a better explanation than I've gotten from two years of listening to electricians complain about them. Thanks for asking it.

# ----------------------------------------------------------------------------
- id: T196
  brief: B053
  category: E
  topic: E3_afci_nuisance
  type: question
  trade: plumbing
  when: late
  author: big_paulie_plumb
  title: "new lower element in an electric water heater and the breaker trips instantly"
  fact_risk: ["typical residential element resistance range", "fill and purge the tank before energizing (dry-fire)"]
  body: |
    sorry if this is a dumb one, 4 years in and i mostly do gas tanks. condo in north bergen, electric 40 gallon, no hot water. tested and the lower element was bad so i swapped it. drained it, new element in, filled it up, turned the breaker back on and it tripped right away. reset, tripped again. didn't touch anything else. is the new element bad out of the box or did i do something
  replies:
    - author: oldsteam_zig
      accepted: true
      body: |
        First question, kid: did you open a hot faucet and let it run until the water came out solid, no spitting, before the breaker went on? If the top of that tank had air in it, the upper element runs dry and dies, and sometimes takes the breaker with it.

        Second: an instant trip usually means a short, not a weak element. Breaker off, verify dead at the heater, pull the wires off the element and check it with your meter. Across the two terminals you should read some ohms, roughly 10 to 17 depending on the wattage. From either terminal to the tank should read open. While you're in there, look hard at the wires you pushed back under that cover. That's the job.
    - author: codebook_dale
      body: |
        Agree with all of that. From the electrical side, a straight short to ground trips any breaker instantly, and the usual spot after an element swap is a conductor pinched by the cover or nicked on the bracket. Check the insulation on both leads before you close it up.
    - author: Elizabeth.traps
      body: |
        burned up my first element that way, breaker went on before the tank was full. seconds and done. my foreman makes me bleed every tank now
    - author: big_paulie_plumb
      body: |
        update: it was the wire. the lower lead got jammed against the edge of the bracket when i stuffed the insulation back in, cut right through. new piece of wire, works fine. element was ok the whole time

