- id: T185
  brief: B010
  category: E
  topic: E1_sweat_vs_press
  type: question
  trade: electrical
  nyc: true
  when: late
  author: elecny85
  title: "Plumber says the water pipe bond is pointless now that it's PEX"
  fact_risk: ["metal water service as grounding electrode, connection near entry, jumper around the meter (NEC 250.52/250.53/250.68)", "bonding of interior metal water piping (NEC 250.104(A))", "NYC Electrical Code amendments to the NEC", "CSST bonding requirements"]
  body: |
    non union apprentice in brooklyn... we're on a 3-family townhouse new build in east flatbush. copper water service comes in from the street to the meter, then the plumber ran everything after the meter in PEX. my foreman wants the water bond done a certain way and the plumber is laughing at him, says "it's all plastic brother, there's nothing to bond, that's from the 80s."

    my foreman just said "do it anyway." I'd like to actually understand who's right because they're both going to ask me to do stuff on this job... is the plumber right that PEX means no water bond? and why does the meter matter at all? thanks in advance
  replies:
    - author: HelperForNow
      body: |
        following. our shop just clamps to whatever copper is near the panel and calls it a day, now im wondering
    - author: codebook_dale
      accepted: true
      body: |
        Two separate questions, and the plumber and your foreman are each answering a different one.

        One: is the water service an electrode? If the pipe coming in from the street is metal and in the earth long enough, it counts as a grounding electrode, it gets connected close to where it enters, and the connection can't depend on the meter, so there's a jumper around it. If the service is plastic, it isn't an electrode and you need others.

        Two: is there metal water piping inside that has to be bonded? If the inside is all PEX, there may be very little. But a copper service up to the meter is metal piping either way.

        You're in the city, so it's the NYC Electrical Code with its own amendments, and I inspect in Jersey. Check which code edition applies to your permit, and ask your foreman.
    - author: bklyn_arkady
      body: |
        In the city it's different on paper, but the physics is the same. On my townhouse jobs the service comes in copper to the meter, the electrician bonds it near the entry with a jumper around the meter, and after that we go PEX. Nobody argues about it on my jobs.
    - author: rui_t_kearny
      body: |
        My father used to say never cut a water pipe without a jumper on it first. If there's an open neutral on the street, the current goes looking for a path, and the plumber holding both ends of a cut pipe becomes the path. I keep a jumper cable with two clamps on my truck for exactly this.
    - author: JunctionBoxJunkie
      body: |
        wait so if it's all pex then there's nothing to bond and the plumber is right? our shop teacher said pex basically killed the water pipe ground. so the plumber kind of has a point
    - author: codebook_dale
      body: |
        > pex basically killed the water pipe ground

        Partly. It changed what's there to bond. If there's no metal water piping, there's nothing to bond on that system. But on his job the service is copper up to the meter, so that copper is still in play. The answer is always what's actually in the building, not what someone says is in it.
    - author: mbell_wireman
      body: |
        Whatever the answer on paper, treat that pipe as possibly energized until you've proven otherwise. I've watched a meter get swapped in an occupied building with no jumper on and the plumber got bit. A jumper and gloves cost nothing. Stay safe.
    - author: joyd_plumbing
      body: |
        What's your actual question: who's right, or who has to do it? On my jobs the bond is the electrician's. My part is not removing it, and putting a jumper on before I cut anything.
    - author: dreb_jman
      body: |
        Brother, in the high-rises it's the same story, just bigger. Bonding on the water risers, the gas, the steel. Nobody on my job touches a bond without the foreman knowing.
    - author: elecny85
      body: |
        ok this is making more sense... so the plumber is half right? the pex isn't anything to bond but the copper service before the meter still is. thanks for the patience lol
    - author: oldsteam_zig
      body: |
        Half right is how most job-site arguments end up, kid. Tell the plumber to put a jumper across before he swaps that meter, and tell your foreman where the bond is so nobody "cleans it up" later. That's the job.
    - author: groundrod_05
      body: |
        Apex grad here. We were taught the clamp goes on the street side, within the first few feet of where the pipe enters the building, not on some random pipe near the panel. Appreciate everyone explaining the jumper part, that one we didn't really cover.
    - author: thiago_sparks
      body: |
        Honestly I see the flip side of this down the shore. After Sandy a lot of houses got repiped in PEX and the old water bond got left clamped to a stub of copper going nowhere. Looks official, does nothing.
    - author: HelperForNow
      body: |
        edit to my earlier post: asked my boss. he said we clamp the service copper near where it comes in, and he just bought the plumbers a jumper lol. so "whatever copper is near the panel" was me not paying attention
    - author: auelecny
      body: |
        Career switcher in Ozone Park here. idk if this is a dumb question but what about the gas pipe, brother? Does that get bonded too or is that a different thing?
    - author: bklyn_arkady
      body: |
        Gas is its own question. Metal gas piping gets bonded too, and the yellow flexible gas tubing has its own bonding requirements from the manufacturer and the code. In the city I let the electrician and the inspector settle exactly how. Gas bonding is not a place to get creative.

