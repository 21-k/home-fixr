- id: T200
  brief: B120
  category: E
  topic: E4_superheat_subcool
  type: question
  trade: hvac
  when: mid
  author: QuickChekCrew
  title: "Should gauges go on every system at a maintenance visit?"
  fact_risk: ["refrigerant loss from hoses on connection", "low-loss fittings"]
  body: |
    Night program student here... I've been doing a ride-along with a tech this summer through a friend. At every maintenance visit he puts gauges on. My instructor says don't hook up gauges on a system that's working unless you have a reason, because you lose refrigerant every time... The tech says you can't know it's working without them.

    Who's right? Or is it one of those "depends" answers... I'd like to understand the reasoning so I don't pick up a bad habit early. Thanks in advance.
  replies:
    - author: Kash_sing
      body: |
        Your instructor is closer, in my opinion:
        - Every connection is a chance for a leak, a contaminated port, or a valve core that doesn't reseat
        - On a small system, what's left in the hoses is a real share of the charge if you don't handle it properly
        - You can learn a lot without them: temperature split, line temperatures, amp draw, airflow, a clean coil
        - When those tell you something's off, then connect, with low-loss fittings

        Plenty of good techs disagree with me on this, and that's fine. Just have a reason for every connection.
    - author: hec_does_ac
      body: |
        I'm one of the ones who disagrees lol... I don't put hoses on every visit, but I do put clamp-on temp probes and wireless pressure probes on most systems. Low loss, and I'd rather see real numbers than guess from a temperature split. So this one time in AC the split looked fine on a rooftop unit and the superheat said it was way short on charge. The split doesn't tell you everything.
    - author: joe.plumb
      body: |
        we put a gauge on every water heater and boiler job, static pressure on the house, takes a minute... is hvac different?
    - author: tnguyen_refrig
      body: |
        he's asking about refrigerant gauges, not water pressure lol. different thing. on walk-ins i only connect when the box tells me something's wrong. every connection is a leak waiting for july
    - author: WhichTradeTho
      body: |
        Taking a night class too and we got told the same thing as your instructor. Interesting that the field guys split on it.

# ========================= E5 family: condensate ============================
- id: T201
  brief: B095
  category: E
  topic: E5_condensate_sizing
  type: question
  trade: hvac
  when: mid
  author: HeatwaveOnCall
  title: "where can a condensate pump actually drain in a finished basement"
  fact_risk: ["acceptable condensate disposal points (local plumbing code / inspector)", "air gap or air break for indirect waste", "condensate pump safety switch wiring"]
  body: |
    ok so long story, we're doing a furnace and coil swap in a split-level in clifton and the basement is getting finished. right now the condensate pump just dumps into the laundry sink with the tube clipped on the edge. homeowner wants it "hidden," so the contractor finishing the basement asked if we can run it into the washer standpipe or tie it into the sump pit. my lead said "depends" (of course) and that it's the inspector's call. what are the normal options and which ones get people in trouble? also does the pump need anything wired to it besides the plug
  replies:
    - author: ms_almonte
      body: |
        First thing my students forget: condensate is waste, and where it goes is a plumbing code question in your town, so the inspector really is the answer. Second: whatever it drains into, don't make a direct connection to a drain without an air gap or air break. You don't want sewer gas coming back up the tube, or a backup pushing into the pump.
    - author: Kash_sing
      accepted: true
      body: |
        Field version, around here:
        - Laundry tub, or a standpipe with an air gap, is the common option and usually accepted. Check locally
        - The sump pit gets used a lot and some towns don't allow it. Ask before you do it
        - Never glue it straight into a drain or a vent with no trap and no air gap
        - Wire the pump's safety switch so the AC shuts off if the pump fails. Most pumps have the switch; plenty of installers never connect it
        - Leave access. Finished basements bury pumps behind drywall and then it's a callback

        The safety switch is the one that saves the new floor.
    - author: epa60812_2
      body: |
        brother we had one in paterson where the pump was buried inside a soffit, took my lead an hour just to find it. leave it where you can get to it
    - author: HeatwaveOnCall
      body: |
        update: inspector was fine with the standpipe with an air gap. we wired the safety switch into the furnace control so the ac stops if the pump dies. contractor is building a little access door. thanks everyone

# ----------------------------------------------------------------------------
- id: T202
  brief: B124
  category: E
  topic: E5_condensate_sizing
  type: question
  trade: hvac
  when: late
  author: OpenNeutralBlues
  title: "Electrical student: why does the HVAC float switch cut the thermostat wire?"
  fact_risk: ["float switch wired in series with R or Y per instructions"]
  body: |
    Electrical student at the county vo-tech, Nutley. I've been shadowing an HVAC tech friend of my dad's on Saturdays. He put a float switch on an AC drain pan and wired it into the thin thermostat wire, not the power. In class everything we do is 120 or 240, so I asked why not just cut power to the unit. He said "it's the control side." Can someone explain why it's done that way, and which wire it goes on?
  replies:
    - author: Kash_sing
      body: |
        "Control side" is the right answer. Here's why:
        - The thermostat wiring is 24 volts and tells the system when to run. Open one wire and the call for cooling stops
        - Most of those float switches are made for low-voltage control wiring, not for the line voltage the equipment runs on
        - It usually goes in series with the R or the Y, depending on what you want shut down and what the instructions say
        - Killing line power can also shut off things you might want running, like the blower

        Follow the switch instructions and the equipment's wiring diagram, not a rule of thumb.
    - author: ms_almonte
      body: |
        And low voltage still deserves respect. First thing my students do on 24 volt wiring is short R to C and blow the little fuse on the control board. Second thing they do is swear it wasn't them. Ask me how I know.
    - author: wchen_controls
      body: |
        fwiw controls is a whole trade built on exactly this. a small signal decides what the big equipment does. if that part interests you, look at low voltage and controls. the work is mostly indoors in august too

# ----------------------------------------------------------------------------
- id: T203
  brief: B170
  category: E
  topic: E5_condensate_sizing
  type: question
  trade: hvac
  when: late
  author: ExRetail_NowHVAC
  title: "First fall startups: high-efficiency furnace drain lines, what size and how much pitch?"
  fact_risk: ["condensate drain not smaller than 3/4 in and not reduced from the equipment connection (mechanical code)", "minimum slope 1/8 in per foot", "manufacturer guidance against double-trapping condensing furnaces", "freeze protection per manufacturer"]
  body: |
    Haven't started yet, but my new shop let me ride along on fall startups this week, sorry for the basic question. We're doing fall startups and maintenance, and two furnaces this week had condensate problems. One in a garage in Sicklerville where the line ran dead flat and was half full of slime, one in Blackwood where somebody necked the drain down to 1/2 inch tubing because "it's just a furnace." That one was shutting off on the pressure switch.

    My lead fixed both, but I want the rules in my head. What size should the line be, how much pitch, and does it need a trap if the furnace has one built in? And what about the garage one freezing this winter? Damn, I thought heating was going to be the easy season.
  replies:
    - author: ms_almonte
      accepted: true
      body: |
        First: don't neck it down. The mechanical code I learned on wants condensate drains no smaller than 3/4 inch and no smaller than the equipment's connection, all the way to where they end. Check which edition your town enforces and the furnace manual, because the manual can ask for more.

        Second: pitch. At least an eighth of an inch per foot, more if you can get it. Flat lines grow exactly the slime you saw.

        Third: traps. Most condensing furnaces have their own trap, and the manual will usually tell you not to add a second one in series, because a double trap can air-lock. Read it for that model.

        Fourth: the garage. Protect it from freezing the way the manual says, or reroute it inside. Ask me how I know what a frozen line does in January.
    - author: Kash_sing
      body: |
        Two more from the business side:
        - Condensate from a condensing furnace is acidic. If it's going into a cast iron drain or onto a floor, talk about a neutralizer. Customers like hearing why
        - Fall startups are where you clean the trap and the line and pour test it. That prevents the January no-heat call, which costs you more than the visit pays
    - author: Dev_H
      body: |
        plumbing side, we see these tied into floor drains and laundry tubs. is there a rule on where it can go, or is it the same as an AC drain? appreciate it
    - author: hec_does_ac
      body: |
        Same idea as the AC drain, where it lands is the inspector's call, and an air gap if it's going to a drain... So this one time in Gloucester a whole basement smelled like sewer every fall. Somebody glued the furnace drain straight into the stack, and the furnace's trap dried out every summer. Fix took ten minutes, finding it took two hours lol.
    - author: tnguyen_refrig
      body: |
        drain lines freeze down here too, not just up north. had a walk-in freezer in somers point go down on the coldest night because the drain line ran through an unheated hallway with no heat tape. winter is when you learn
    - author: ExRetail_NowHVAC
      body: |
        This is gold, thank you. Writing "3/4, eighth inch per foot, read the trap section" on the inside of my van door. Lead says that's how he learned too.

# ======================= E6 family: heat pumps, winter =======================
- id: T204
  brief: B093
  category: E
  topic: E6_heat_pump_nj_winter
  type: discussion
  trade: hvac
  nyc: true
  when: late
  author: dreb_jman
  title: "Midtown tower going all heat pump. How do these do 40 floors up in January?"
  fact_risk: ["NYC Local Law 97 driving building electrification", "cold-climate heat pump capacity at low ambient", "supplemental heat in electrical load calculations"]
  body: |
    Question for the mechanical guys. The office tower in Midtown I'm on is ripping out the old steam and going all electric heat pumps, because of the city's emissions law from what the owners say. My side is new feeders up the risers, a lot more amps on every floor than the building was ever built for. Fine. That's our work.

    What I want to know from the mechanical side: rooftop and setback units up there get wind like you wouldn't believe. On a 10 degree January night, 40 floors up, with wind, do these things actually keep up? Or are we going to be back in two winters adding electric heat and more feeders? Asking because I'm the one who'll be up there.

    Also the 7 train is down again, so I have time to read.
  replies:
    - author: Kash_sing
      body: |
        Not a high-rise guy, but these are the questions I'd ask the engineer:
        - What's the rated capacity at the design low temperature, not at 47 degrees? Cold-climate equipment publishes it
        - Is there backup or supplemental heat in the design, and is that load already in your feeder calc?
        - Defrost: where does the water go, and does it freeze on the roof?
        - Who services them, and can they get to them in February?

        If the engineer has answers to all of those, you're probably fine.
    - author: mbell_wireman
      body: |
        Data center side, we see the same thing: every mechanical change ends up being an electrical change. Get the supplemental heat into the load calc now, not as a change order later.
    - author: hec_does_ac
      body: |
        So this one time in AC... the casino I worked at had rooftop heat pump units on the garage that iced up every time the wind came off the ocean in February lol. Wind matters. The engineers who've done tall buildings use screens or put the units on mechanical floors instead of out in the open.
    - author: codebook_dale
      body: |
        From the inspection side, and I don't inspect in the city: the load calculation and the equipment nameplates will tell the story. Whatever the mechanical engineer says about supplemental heat should show up on the electrical drawings. If it doesn't, ask.
    - author: threeway_91
      body: |
        staten island apprentice here, brother. our shop wired a bunch of heat pumps in houses out here last winter and they kept up fine. in houses though. no idea about 40 floors up
    - author: neutral_bar_99
      body: |
        Student question, possibly off topic: why not geothermal for a building like that? We read about it in class and it seemed like it avoids the cold air problem entirely.
    - author: dreb_jman
      body: |
        Not off topic, brother. You need somewhere to drill, and in Midtown there's a subway and a lot of foundation under you. Some buildings in the city do it. Not ours.
    - author: HelperForNow
      body: |
        following this one. our shop in manahawkin does more heat pumps every month and nobody talks about the electrical side until the panel is full
    - author: dreb_jman
      body: |
        Appreciate it. Sent the engineer Kash's list. Answer on defrost was "we'll look into it." So that's going great.

# ----------------------------------------------------------------------------
- id: T205
  brief: B152
  category: E
  topic: E6_heat_pump_nj_winter
  type: question
  trade: hvac
  when: late
  author: peteq75
  title: "Galloway colonial on propane: cold-climate heat pump or keep the furnace?"
  fact_risk: ["cold-climate heat pump ratings at 5°F", "NJ Clean Energy and utility rebates (change often)", "whole-house load calculation for panel capacity", "nameplate MCA/MOCP"]
  body: |
    Sorry if this belongs somewhere else. I'm brand new on the electrical side, career switcher, but this one is my own house. 90s colonial in Galloway, no gas on our street, propane furnace and a central AC that's on its last legs. The propane bill last winter was ugly. My wife wants to go heat pump since we have to replace the AC anyway.

    Everybody I talk to says something different. One guy says heat pumps don't work when it's cold. One says get rid of the furnace. One says keep the furnace as backup. And since I'm "the electrical guy" now, everyone asks me if our 150 amp panel can handle it, and I don't know.

    What would you actually do here? Appreciate it.
  replies:
    - author: HelperForNow
      body: |
        my old boss said heat pumps quit working under like 30 degrees and then you're on strip heat and the electric bill kills you. so keep the furnace
    - author: Kash_sing
      body: |
        That was true of a lot of older units. It isn't true of current cold-climate equipment:
        - Cold-climate heat pumps are rated to put out real heat at 5°F. Look at the published capacity at your design temperature, not the brochure
        - Size it from a heat load calculation on your house, not from the old furnace's number
        - Ductwork that was fine for AC can be marginal for heating airflow, so have someone check it
        - NJ Clean Energy and utility rebates change often. Look up what's current before you sign anything
    - author: haddad_mech
      accepted: true
      body: |
        I'd do it a little differently from Kash, with respect. In your situation, with a furnace that still works, I'd look hard at dual fuel: a heat pump for most of the season and the propane furnace for the coldest nights. You give up a little efficiency on those nights, you keep a backup if the heat pump goes down in January, and you don't need electric strips loading your panel.

        If the furnace were old too, a properly sized cold-climate heat pump with strips can absolutely carry a house in Atlantic County. Either way, step one is the load calculation. Anybody quoting you without one is guessing.
    - author: Kash_sing
      body: |
        Fair point. With a furnace that has life left, dual fuel is a good answer and I quote it all the time. I was answering the "they don't work when it's cold" part.
    - author: mbell_wireman
      body: |
        On the panel: 150 amps might be fine. You find out with a load calculation for the whole house, done by an electrician, not by adding up breaker handles. The heat pump nameplate gives you the minimum circuit ampacity and the max breaker size. Strip heat is usually what pushes a panel over.
    - author: tnguyen_refrig
      body: |
        egg harbor twp here, same story on half my street, propane and no gas line. the ones who went heat pump with the furnace as backup are happy. and our design temp down here isn't north jersey's
    - author: hec_does_ac
      body: |
        So this one time in AC... I did a heat pump in Absecon for a guy who swore it would never keep up, and he called me in February just to ask why the house felt so even lol. It runs longer and lower than a furnace. Tell your wife to expect that.
    - author: codebook_dale
      body: |
        Permits for both the mechanical and the electrical side. And if strips are part of it, make sure that circuit is in the load calculation, not added later.
    - author: ThirdYearTinknocker
      body: |
        3rd year hvac in monmouth, we put in alot of these now. warn her the air at the register feels cooler than a furnace, like 90 something instead of way hotter. totally normal, but people call about it
    - author: peteq75
      body: |
        This is way more than I expected, appreciate it. So: load calc first, look at dual fuel since the furnace is only 8 years old, panel calc by an actual electrician. Not by me lol.
    - author: HelperForNow
      body: |
        ok i stand corrected on the 30 degree thing. old boss was going off old units i guess
    - author: peteq75
      body: |
        update: had two companies do load calcs. both came back with a cold-climate unit and keeping the furnace as backup. electrician's calc says the 150 is ok without strips. signing next week

# ===================== E7 family: mini-splits, Cape Cods =====================
- id: T206
  brief: B036
  category: E
  topic: E7_minisplit_vs_ducted_cape
  type: discussion
  trade: hvac
  when: mid
  author: hec_does_ac
  title: "Cape Cods: ductless heads upstairs or a ducted unit in the kneewall?"
  fact_risk: ["multi-zone outdoor units powering heads through the interconnect"]
  body: |
    Settle a fight at my shop... we're doing a lot of Capes in Gloucester and Camden County this summer, upstairs is 85 by 3pm and there's no ductwork up there. Half our guys sell a head in every bedroom. The other half want a small ducted air handler in the kneewall or the attic with short runs to each room.

    So this one time in AC I put three heads in a Cape and the customer called the next summer saying the kid's room was freezing and clammy and the other two were fine lol. Oversized head in a tiny room.

    What do you guys do and how do you decide? Not looking for a brand war.
  replies:
    - author: Kash_sing
      body: |
        How I decide:
        - Small bedrooms: the smallest wall head is often too big for them, so it short-cycles and doesn't pull moisture out. That favors ducted
        - Kneewall space: if there's room for an air handler with short, sealed runs and a real return, ducted is quieter and cleaner looking
        - If the kneewall is cramped, or the customer wants room-by-room control, heads
        - Either way, the insulation in those kneewalls is usually terrible, so price the air sealing in

        Margins are better on the ducted job if you price the labor honestly.
    - author: haddad_mech
      body: |
        Here's how it plays out for us: the ducted kneewall unit is the better system when there's room, but it takes a tech who can actually design duct. Heads are more forgiving for a crew that's still learning. I sell the system my people can install well.
    - author: HeatwaveOnCall
      body: |
        we did a cape in clifton with one ducted unit in the attic over the dormer and it was so quiet the customer thought it was off. getting up there in july was brutal though
    - author: tnguyen_refrig
      body: |
        attic air handler in a cape in july, enjoy. whatever you pick, put a pan and a float switch under it. i've seen what a kneewall full of water does to a ceiling
    - author: thiago_sparks
      body: |
        Honestly on the raised houses at the shore after Sandy we did a lot of heads, because there was nowhere to put anything. Not Capes, but the same problem: no space, no ducts.
    - author: peteq75
      body: |
        Electrical side question, sorry if dumb: does one ducted unit mean one circuit instead of three? That's a lot less work on our end.
    - author: Kash_sing
      body: |
        Depends on the setup. A multi-zone outdoor unit usually powers its heads through the interconnect, so that's one circuit to the outdoor unit. Three separate single-zone systems are three circuits. Follow the install manual either way.
    - author: TaylorHamHVAC
      body: |
        customer question i get a lot in secaucus: do the heads look bad? and can you hide the linesets on the outside of a cape without it looking like spaghetti?
    - author: hec_does_ac
      body: |
        Lol the spaghetti question... lineset covers, run them on the back of the house, and talk about it before the install, not after. Some people hate the look of a head no matter what. Those are your ducted customers.
    - author: big_zach_hvac
      body: |
        first summer in hvac, we did 6 capes in union county, all heads. didn't know ducted in a kneewall was even an option. learning
    - author: ms_almonte
      body: |
        Good thread, I'm stealing it for class. What students should take away is that you decide from the house: the room sizes, the space, the insulation, the customer. Not from whatever your shop usually sells.

