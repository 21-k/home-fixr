- id: T188
  brief: B054
  category: E
  topic: E2_three_way_switch
  type: question
  trade: electrical
  when: mid
  author: peteplumb80
  title: "what does a 4-way switch actually do in the middle?"
  body: |
    UA 1st year, plumbing, so this is pure curiosity. The electrician on our job (commercial bathrooms in a building in Montclair, long corridor outside them) was explaining the corridor lights at lunch. 3-way at each end, I followed that from the other thread on here. Then he said there's a 4-way in the middle and it "flips the travelers" and he lost me. Flips them how? Why can't you just put a third 3-way in the middle?
  replies:
    - author: JughandleJourneyman
      accepted: true
      body: |
        IBEW 2nd year here... the way my foreman explained it: both travelers come into the 4-way, and the 4-way either passes them straight through or crosses them over, so traveler A goes out on B and B goes out on A. Flipping it swaps which traveler is live at the far end... so any switch can change the light. A 3-way only has one common and two travelers, it can't do the swap, which is why the middle one has to be a 4-way. You can put as many 4-ways in a row as you want between the two 3-ways.
    - author: thiago_sparks
      body: |
        Honestly that's one of the better explanations I've seen. Draw it: two 3-ways on the ends, the 4-way in the middle, and trace it with your finger in every position.
    - author: codebook_dale
      body: |
        One thing to add for when you see these in the field: check the 4-way's instructions for which screws are the pair in and which are the pair out. They aren't always laid out the same, and mixing them up gives you exactly the "works sometimes" complaint.
    - author: peteplumb80
      body: |
        ok the crossing over thing finally clicked. kind of like a diverter on a manifold, sort of. thanks guys, back to toilets

