- id: T191
  brief: B099
  category: E
  topic: E2_three_way_switch
  type: question
  trade: electrical
  when: mid
  author: BackflowBlues
  title: "smart switch needs a neutral, can i just use the bare ground?"
  fact_risk: ["equipment grounding conductor may not carry normal current / be used as a neutral", "listed no-neutral smart switches"]
  body: |
    plumbing guy, mostly demo right now lol. my mom wants a smart switch for the porch light at her house in lawrence. got it out of the box and it wants a neutral. switch box has a black, a white taped black, and a bare copper. guy at the store said "some people use the ground as the neutral, it's fine, it only draws like nothing." is that ok or no. not doing anything till somebody tells me
  replies:
    - author: codebook_dale
      accepted: true
      body: |
        No. Don't. The equipment ground is not a current-carrying conductor. It's there to carry fault current long enough to trip the breaker. Put normal current on it and every grounded thing on that circuit, metal boxes, fixture housings, appliance frames, carries a little current all the time, and if that ground path ever opens, those parts can sit at line voltage with nobody knowing. Small current doesn't make it fine.

        What you described, a black and a white taped black, sounds like a switch loop: no neutral in that box. Your options are a smart switch listed to work without a neutral, a smart bulb in the fixture, or a new cable with a neutral to that box. Breaker off and tested dead before anything comes apart.
    - author: JunctionBoxJunkie
      body: |
        honestly people do it all the time, my cousin did it in his whole house. a smart switch pulls a few milliamps, nothing is going to happen. no inspector is ever coming back to look at a porch switch
    - author: thiago_sparks
      body: |
        Honestly I've been on service calls where the "few milliamps" guy did his whole house, and we found it because the GFCIs and AFCIs kept tripping. It's not about the inspector coming back. It's about whoever touches that fixture someday when the ground's loose. Don't.
    - author: mbell_wireman
      body: |
        Agree with both of them. And whatever you end up doing, kill the breaker and verify dead with a tester you've checked. Porch lights sometimes share an outdoor circuit with things you wouldn't expect. Stay safe.
    - author: wchen_controls
      body: |
        fwiw the no-neutral smart switches are a real product, listed, and they work by trickling a tiny bit of current through the bulb instead of through the ground. downside is some leds flicker or glow with them. low voltage guy here, we run into this all the time on retrofits
    - author: benplumb79
      body: |
        Sorry if this is a dumb question, but how would you even tell the white is taped because it's a switch loop and not just somebody's random tape?
    - author: codebook_dale
      body: |
        Not dumb. Breaker off, open the fixture box and look. In a switch loop the white from the switch cable is spliced to a hot, not to the other whites. If you can't tell, assume it isn't a neutral.
    - author: peteplumb80
      body: |
        UA here, and this is the same conversation we have about tying a vent into a drain because "it works." works until it doesn't
    - author: plumbnj88
      body: |
        smart bulb is the easy answer. we had them at the bar i used to work at, zero wiring, never had a problem
    - author: BackflowBlues
      body: |
        update: got the no neutral one that says it's listed for that. my foreman's brother is an electrician, he came by and put it in. porch light works from the phone. mom happy. thanks

# ----------------------------------------------------------------------------
- id: T192
  brief: B140
  category: E
  topic: E2_three_way_switch
  type: question
  trade: electrical
  when: late
  author: Exit117Plumber
  title: "LED bulbs on the basement stairs glow when the switches are off"
  body: |
    Helping my uncle again this weekend. His basement stairs have a light with a switch at the top and the bottom. He swapped the old bulbs for LEDs and now with both switches off they glow really faint, like a nightlight. He says it's cheap bulbs and to ignore it. I'm a plumbing kid so I don't really know electrical, but it bugs me. Is that a bulb thing or is something wired wrong? Should I be worried about it
  replies:
    - author: Dev_H
      body: |
        had this in my apartment, swapped brands and it went away. so cheap bulbs, or was something else going on with mine too?
    - author: mbell_wireman
      body: |
        Could be the bulbs, could be the wiring, and it's worth knowing which. The common harmless cause: on a 3-way the two travelers run side by side in the same cable, and on a long run a little voltage couples from one to the other. An incandescent never shows it. An LED needs so little that it glows. Lighted switches do the same thing.

        The cause you want to rule out is the switches breaking the neutral instead of the hot. Then the fixture is still hot when it's off, and somebody changing a bulb gets a surprise. Have someone qualified check it with a meter. If it's coupling, a different bulb or a small device made for this usually fixes it. Stay safe.
    - author: peteplumb80
      body: |
        my parents had this in Montclair, turned out to be the lighted switch at the bottom of the stairs. took it out, glow gone
    - author: joyd_plumbing
      body: |
        What's your actual question? "Should I be worried" is the real one, and the answer is: not until somebody checks it. Have your uncle get an electrician to look. It's a short visit.

# ====================== E3 family: AFCI, GFCI, tripping ======================
- id: T193
  brief: B022
  category: E
  topic: E3_afci_nuisance
  type: question
  trade: electrical
  when: late
  author: RainDayRestock
  title: "Bedroom AFCI at my dad's place trips every couple nights. Just swap it?"
  fact_risk: ["breaker size limited by conductor (14 AWG / 15 A)", "combination AFCIs with ground-fault sensing trip on shared neutrals", "AFCI trip indicators vary by manufacturer"]
  body: |
    Sorry if this is a dumb question, I'm about a month in as a helper in Brick. My dad had his panel replaced in the spring by an electrician (not my boss) and now the breaker for the back bedroom trips every two or three nights. Always at night, sometimes with nothing on but a fan and a phone charger. It's one of the breakers with the test button.

    My dad's answer is "you work for an electrician now, put a regular breaker in." I said I'd ask first. The house is a 60s ranch, some of the wiring is original. Is the breaker just bad? Is it the fan? What would you even check?
  replies:
    - author: neutral_bar_99
      body: |
        Not an expert, I'm in vo-tech, but in our class we learned breakers trip when the load is too high. If it's a 15 amp, maybe it just needs to be a 20 amp so it stops tripping. That seems like the simplest thing to try first.
    - author: codebook_dale
      body: |
        Please don't. The breaker size is set by the wire, not by what you want to plug in. If that bedroom is wired in 14 gauge, a 20 amp breaker lets the wire overheat before it trips, and that's how fires start. And a breaker that trips with a fan and a phone charger on isn't tripping on load anyway.
    - author: neutral_bar_99
      body: |
        Understood, thank you for the correction. I didn't realize the wire was what set it.
    - author: thiago_sparks
      body: |
        Honestly the first generation of these nuisance tripped like crazy and I cursed them on every Sandy rebuild. The newer ones are a lot better, but I still see the odd one that just doesn't like a certain fan motor or treadmill.
    - author: codebook_dale
      accepted: true
      body: |
        Thiago's right that the early ones had problems. What I see now, most trips are telling you something real. Field version of what I'd check, in order:

        Is it a combination type that also senses ground faults? Many are. Then a neutral from that bedroom shared with another circuit somewhere, or a neutral touching ground in a box, will trip it, and a 60s ranch that's been added onto is exactly where that hides. Next, a loose connection or a backstabbed receptacle on the run. Then damaged cable: a nail, a staple driven too tight. Then the loads. Unplug the fan for a week and see.

        And don't put a regular breaker in. That panel was just replaced under a permit, so call the electrician who did it back. It's very likely theirs to solve.
    - author: dahvacnj
      body: |
        hvac not electrical, but my house in toms river did this and it turned out to be the window ac. new ac, no more trips. thanks in advance for not laughing
    - author: Dev_H
      body: |
        plumbing guy in deptford. question for the electricians: how would he even find a shared neutral, is it just opening every box? appreciate it
    - author: thiago_sparks
      body: |
        Pretty much, plus some tricks. Circuit off, look at how the neutrals land in the panel, open the boxes on that run and the ones next to it. In an old ranch you're also in the attic looking for junction boxes nobody remembers. It's a couple of hours, not a couple of minutes.
    - author: Passaic_Sparky
      body: |
        service guy here. most of these i find a neutral tied together in a box in the attic or the basement. idk why people did that, saved a wire nut i guess
    - author: hec_does_ac
      body: |
        So this one time in AC... hotel room kept tripping and it was the guest running a hair dryer and a space heater on the same outlet lol. Not saying that's your dad, but ask what's plugged in back there.
    - author: WawaRunWired
      body: |
        sorry if dumb but does the breaker tell you anything about why it tripped? some of ours have lights that blink after
    - author: Passaic_Sparky
      body: |
        yeah some of them do, depends on the brand. there's a code on the label or the manufacturer sheet, like arc vs ground fault. look it up for whatever's in his panel before you start opening boxes
    - author: RainDayRestock
      body: |
        update: unplugged the fan all week and it still tripped, so dad gave in and called the electrician back. He found the bedroom neutral tied in with the hallway circuit's neutral in a junction box in the attic, from some old add-on. Separated them, no trips since. Mom says thanks too, she was tired of resetting it.
    - author: thiago_sparks
      body: |
        There it is. Shared neutral in the attic. Good on you for asking before swapping the breaker.
    - author: JerseyTomatoWires
      body: |
        saving this one... my foreman always says the breaker is just the messenger. appreciate it

