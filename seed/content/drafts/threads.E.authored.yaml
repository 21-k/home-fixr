- id: T197
  brief: B102
  category: E
  topic: E3_afci_nuisance
  type: question
  trade: plumbing
  when: late
  author: plumbguy917
  title: "New dishwasher trips the GFCI on the dry cycle. On us or the electrician?"
  fact_risk: ["GFCI protection for dishwasher outlets (varies by code edition and NYC code)"]
  body: |
    1st year, Local 1. Last week my journeyman had me do the water and drain on a dishwasher in a Bay Ridge apartment, the electrician did the circuit. Customer called back: it runs through wash and rinse fine, then the GFCI trips on the heated dry. Electrician says it's the appliance. Customer's blaming us because we were the last ones under there lol.

    Is there any way a water connection trips a GFCI, or is this not our problem?
  replies:
    - author: codebook_dale
      body: |
        It can absolutely be your problem without being your circuit. A GFCI trips when current leaks to ground. Two common causes on a new dishwasher: the heating element leaking current once it gets hot, which is the appliance, and water getting into the junction box under the front, which can be a weeping supply fitting right above it.
    - author: joe.plumb
      body: |
        had a callback like this in cherry hill... the elbow on the supply was weeping onto everything, you couldn't see it unless the kick plate was off and it was running
    - author: thiago_sparks
      accepted: true
      body: |
        Honestly the dry-cycle detail is the clue. Heat makes a failing element leak, and heat plus a little water in a box makes a GFCI unhappy. Look at your fitting first because it's free: dry the whole area, run a cycle with the kick plate off, flashlight on the connection. If it's bone dry and it still trips on heat, it's the appliance and the customer calls the manufacturer. Either way, nobody bypasses the GFCI.
    - author: Exit117Plumber
      body: |
        My uncle tapes the threaded side of the dishwasher elbow (never the compression side) and checks it with a paper towel after the first fill. The paper towel shows drips you can't see.
    - author: plumbguy917
      body: |
        update: went back with my journeyman. elbow was weeping right onto the j-box. redid it, ran two full cycles, no trip. so yeah it was us lol. paper towel trick is going in my bag

# ----------------------------------------------------------------------------
- id: T198
  brief: B088
  category: E
  topic: E3_afci_nuisance
  type: tip
  trade: electrical
  when: late
  author: codebook_dale
  title: "Sump pumps on GFCI: what I tell homeowners after every big storm"
  fact_risk: ["GFCI required for basement receptacles in current NEC editions", "removal of the dedicated single-receptacle (sump) exception several code cycles ago", "hardwired sump pumps and GFCI rules / local acceptance"]
  body: |
    Every big rain, I hear the same complaint: "the GFCI tripped and my basement flooded, why does code make me do this?" Here's how I explain it.

    Current code editions want GFCI protection on basement receptacles, and the old exception that let a single dedicated sump receptacle skip it went away several cycles back. Check which code edition is in effect for your permit, because an older install may have been legal when it went in.

    A GFCI that trips on a sump pump is usually telling you something. Pumps sit in water, and as they age the windings and cords leak current. That leak is exactly the thing that kills people in wet basements.

    So the answer I give isn't "remove the GFCI." It's: put a high-water alarm in the pit, think hard about a battery backup pump, test the GFCI and the pump before storm season, and replace a pump that keeps tripping it. Not legal advice, just how I'd look at it after too many flooded basements.
  replies:
    - author: thiago_sparks
      body: |
        Honestly I'm torn on this one and I'll say it. After Ida I had three customers with flooded basements, and every one was a tripped GFCI on the sump. I install it the way the code says, but I push the alarm and the backup pump hard, because a GFCI by itself is a bad plan in a basement that floods.
    - author: codebook_dale
      body: |
        Fair, and we're not that far apart. The GFCI isn't the plan, it's the protection. The alarm and the backup pump are the plan.
    - author: oldsteam_zig
      body: |
        Plumber's side: half the pumps I pull that were tripping GFCIs have a cord that's been sitting in water or a motor on its way out. Replace the pump, check the check valve while you're there, and the trips go away. A good pump tripping a good GFCI is rare.
    - author: neutral_bar_99
      body: |
        As a student, may I ask why not put the sump on its own hardwired circuit with no receptacle at all? Wouldn't that avoid the GFCI question entirely?
    - author: codebook_dale
      body: |
        Good question. Depending on the pump, the code edition and what your local office accepts, hardwiring can change the analysis, but most pumps are cord-and-plug so they can be swapped fast at 2am. Ask the inspector before you plan around it. I wouldn't treat it as a loophole.

# ============================ E4 family: charging ============================
- id: T199
  brief: B025
  category: E
  topic: E4_superheat_subcool
  type: tip
  trade: hvac
  when: early
  author: ms_almonte
  title: "Target superheat needs indoor wet bulb. Students, buy the probe."
  fact_risk: ["target superheat charts use indoor (return) wet bulb and outdoor dry bulb"]
  body: |
    Every summer a few of my former students come back from their first jobs saying they "checked the superheat" on a piston system and it was fine. Then I ask what their target was and they look at me.

    First, superheat by itself is just a number. On a fixed orifice system you compare it to a target, and the target comes from the manufacturer's chart or a target superheat chart, using indoor wet bulb and outdoor dry bulb.

    Second, wet bulb, not dry bulb. Wet bulb tells you how much moisture the coil is dealing with, and that moves the target a lot. A sticky July afternoon in Paterson and a dry day in September want different numbers.

    Third, measure the return air at the unit, not in the hallway.

    Buy a decent wet bulb probe before you buy the fancy gauges. Ask me how I know which one matters more.
  replies: []

