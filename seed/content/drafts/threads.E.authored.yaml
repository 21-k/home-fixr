- id: T208
  brief: B103
  category: E
  topic: E7_minisplit_vs_ducted_cape
  type: question
  trade: hvac
  when: late
  author: MonmouthPlumber
  title: "One multi-zone outdoor unit or separate single-zone systems for my Cape?"
  fact_risk: ["single-zone vs multi-zone part-load efficiency and low-temperature ratings"]
  body: |
    This is for my own house, not a job. Cape in Middletown, upstairs has two bedrooms and a small bath, downstairs has the original oil-fired baseboard and window units. We're finally doing mini-splits before next summer.

    I have two quotes. One is a single multi-zone outdoor unit with three heads. The other is three separate single-zone systems, one for each bedroom plus one for the living room, so three outdoor units. The second is more money and more equipment on the side of the house.

    The salesman on the first one says multi-zone is "the same thing, just one box." I'm a plumber, so I get suspicious when someone says that. What are the actual tradeoffs? Thanks in advance.
  replies:
    - author: Kash_sing
      body: |
        It's not the same thing:
        - One multi-zone outdoor unit fails, every room is down. Separate systems fail one at a time
        - Multi-zone units often run less efficiently when only one small head is calling, which in a bedroom is most of the night
        - Single-zone units usually have better low-temperature heating ratings, if you care about heat
        - Multi-zone is fewer boxes outside and one circuit, which some houses need

        For three rooms I lean singles if the budget and the wall space allow. For five rooms in a small house, multi-zone starts making more sense.
    - author: hec_does_ac
      body: |
        Agree with Kash mostly... the one thing I'd add is ask both companies for the head sizes, room by room. Small bedroom with a big head is the callback I see the most lol
    - author: benplumb79
      body: |
        Sorry if this is off topic, but since the downstairs is oil baseboard, would they replace that too, or do people keep the boiler for heat?
    - author: MonmouthPlumber
      body: |
        We're keeping the boiler for now. Getting the upstairs comfortable is the goal this year, heat can be the next project.
    - author: Dev_H
      body: |
        plumbing in deptford. my parents went multi-zone and the outdoor unit died last july, whole house hot for a week waiting on a part. appreciate the singles point
    - author: PullingWireAgain
      body: |
        Electrical side... three singles is three circuits and three disconnects... ask who's doing the electric and whether it's in the price
    - author: NorthJerseyCopper
      body: |
        UA 24 1st year. Asking for the same reason, my parents have a Cape in Fair Lawn. Following.
    - author: MonmouthPlumber
      body: |
        update: asked both for head sizes. The multi-zone quote had a head in the small bedroom about twice what the other company sized. Going with the singles.

# ======================= E8 family: oil-to-gas, fuel gas =====================
- id: T209
  brief: B074
  category: E
  topic: E8_oil_to_gas
  type: question
  trade: plumbing
  when: late
  author: FluxOnMyBoots
  title: "what actually happens in an oil to gas conversion, start to finish"
  fact_risk: ["utility gas service and meter process", "oil tank removal/abandonment rules vary by town", "permits and inspection before utility turn-on"]
  body: |
    career switcher, night class, ewing. my neighbor is converting from oil and asked me what's involved since i'm "in plumbing now" lol. i have no idea and ziggy's on a job all week so asking here. who does what, how long does it take, and what happens to the tank in the basement? just want the big picture so i don't say something dumb to him
  replies:
    - author: Kash_sing
      body: |
        Big picture, roughly in order:
        - Utility first: is gas available on the street, and how long for a service and a meter. That timeline drives everything
        - Equipment: a new gas boiler or furnace is the usual answer. Converting the old oil boiler with a gas burner is possible but less common
        - Venting: a liner for the chimney, or a direct-vent unit out the side wall
        - Gas piping sized from the meter to everything that will burn gas
        - Permits and inspections before the utility turns it on
        - The oil tank: removed or properly abandoned, depending on the town and where it is

        A licensed contractor for all of it. Your neighbor's job is to pick someone good, not to figure it out.
    - author: oldsteam_zig
      body: |
        Kash covered it. One thing for you, kid: next time the neighbor asks, the right answer is "call two licensed shops and ask them about the chimney and the tank." Knowing what to ask is half of it. That's the job.
    - author: NorthJerseyCopper
      body: |
        UA 24 here, 1st year. We did two of these in Fair Lawn this summer. The tank part took longer than the boiler both times. Idk why but every time.

# ----------------------------------------------------------------------------
- id: T210
  brief: B089
  category: E
  topic: E8_oil_to_gas
  type: question
  trade: plumbing
  when: late
  author: TryingAllThree
  title: "Three conversion quotes, three different answers on the chimney"
  fact_risk: ["orphaned water heater draft problems / chimney liner sizing", "sidewall vent materials per manufacturer"]
  body: |
    Different kind of question from me. We're finally converting our own house in Piscataway from oil to gas: split-level, oil boiler with baseboard, hot water off a tankless coil in the boiler. Got three quotes and they disagree on the chimney.

    Quote 1: new gas boiler and a new gas water heater, both into the chimney with a new liner.
    Quote 2: high-efficiency boiler vented out the side wall in plastic, new water heater into the existing chimney, no liner.
    Quote 3: high-efficiency boiler out the side wall, a separate sidewall-vented water heater, chimney not used at all.

    Quote 2 is cheapest. Quote 1's guy says Quote 2 is going to cause problems. Who's right, and why does the chimney matter so much? Appreciate it. Joy told me to get more than one quote, so here we are. Still doing ride-alongs too, so this is half for the house and half for me.
  replies:
    - author: oldsteam_zig
      accepted: true
      body: |
        Quote 1's guy is pointing at a real problem, kid. That old chimney was sized for an oil boiler sending a lot of hot exhaust up it. Take the boiler out, and a gas water heater alone in that big flue is what we call an orphaned water heater. Not enough heat to draft right, so the flue gas cools and condenses, and you get weak draft, moisture eating the masonry, and possibly exhaust spilling into the basement.

        That's why conversions get a liner sized for whatever's left in the chimney, or take the chimney out of the picture like Quote 3. Quote 2 could be fine if they actually checked that chimney, so ask them exactly how. If the answer is "it'll be fine," that's a no.

        And CO detectors on every floor, whoever you pick.
    - author: Kash_sing
      body: |
        What I'd ask all three:
        - Did you do a heat loss, or are you matching the old boiler's size? Old oil boilers are usually oversized
        - Who removes or abandons the oil tank, and is it in the price?
        - Who handles the gas service with the utility?
        - What's the warranty on the installation, not just the equipment?
    - author: BackflowBlues
      body: |
        my foreman did one of these in lawrence where the water heater got left orphaned in the chimney. went back in november because the co alarm kept going off lol. relined it
    - author: benplumb79
      body: |
        Sorry, newer guy question. Is the side wall vent the white plastic pipe sticking out of the side of houses? I always wondered what those were.
    - author: TryingAllThree
      body: |
        Thanks Ziggy, this is exactly what I needed. Going to ask Quote 2 how they checked the chimney.

        edit: Quote 2 said they'd "see when they get there." Going with Quote 3.
    - author: joyd_plumbing
      body: |
        Good call. "We'll see when we get there" on venting is the answer that gets people hurt. And benplumb, yes, usually PVC or a similar plastic on high-efficiency equipment, whatever the manufacturer specifies.

# ----------------------------------------------------------------------------
- id: T211
  brief: B094
  category: E
  topic: E8_oil_to_gas
  type: question
  trade: plumbing
  when: late
  author: big_hector_plumb
  title: "Customer wants the old oil tank left in the basement after the gas conversion"
  fact_risk: ["NJ DEP involvement and certified contractors when a heating oil tank leaks", "municipal permits for tank removal or abandonment in place", "homeowners insurance coverage of tank leaks", "NYC rules for cellar/vault oil tanks"]
  body: |
    Service tech, Union City. Finishing a conversion next week in a two-family in Weehawken. Customer wants the 275 gallon oil tank in the basement just left there, empty, "for later." Then he tells me the home inspector on another house he's buying found a buried tank in the yard during the tank sweep, and the seller says "it was abandoned years ago."

    Boss is out till Monday and I'm bad at talking to customers lol. What do I tell him on both? I know we don't do tank work, I just don't want to sound like an idiot.
  replies:
    - author: oldsteam_zig
      body: |
        Basement tank first. Empty is never empty, kid. There's always sludge and some oil in the bottom. Leave it and it leaks someday, or the next buyer's inspector flags it. On most of our conversions the tank comes out: pumped, cleaned, cut up, hauled. Your town may want a permit for the removal. Tell him your boss will price it, and don't let him keep it "for later."
    - author: SumpPumpSeason
      body: |
        our boss in woodbridge puts the tank removal right in the conversion quote so the customer can't skip it. saves you this exact conversation. appreciate the thread
    - author: Kash_sing
      body: |
        On the buried tank, from my experience in NJ:
        - Ask the seller for paperwork. "Abandoned" without a permit and closure paperwork from the town means very little
        - If there's any sign of a leak, it becomes a cleanup, and in NJ that brings in DEP rules and certified contractors
        - His attorney and insurance company should hear about it before closing, not after
        - None of this is yours to sort out. Send him to his attorney and a tank company
    - author: oldsteam_zig
      body: |
        And on the buried one, I'd want it pulled and the soil tested before I bought that house.
    - author: rui_t_kearny
      body: |
        Respectfully, Ziggy, pulling isn't always the answer on buried tanks. Some are under a porch, an addition or a driveway, and abandonment in place, done properly with a permit and soil sampling, is what gets done. The paperwork is the thing. Depends on the town.
    - author: oldsteam_zig
      body: |
        Fair, Rui. If it can't come out, it's done on paper. My point is "abandoned years ago" with no paper isn't abandoned.
    - author: joyd_plumbing
      body: |
        What's your actual question? You asked two. Basement: it should come out, your boss prices it. Yard: not your job, send him to a lawyer and a tank outfit. Two sentences, then stop talking.
    - author: big_hector_plumb
      body: |
        > Two sentences, then stop talking.

        lol that's the part i need
    - author: bklyn_arkady
      body: |
        In the city it's different in the details. Some older buildings still have oil tanks in the cellar or a vault, and the rules and who you call are city ones. Same principle though. Nobody believes "empty" and nobody believes "abandoned" without paperwork.
    - author: HeatwaveOnCall
      body: |
        dumb question, why is a buried tank such a big deal if it's just sitting there? like if it's not leaking what's the problem? and who even checks
    - author: Kash_sing
      body: |
        Because old steel in wet soil eventually leaks, and nobody knows when. When it does, the cleanup can get very expensive, and it can land on the homeowner. That's why buyers here do tank sweeps, and why sellers get nervous about them.
    - author: Dev_H
      body: |
        had one in deptford where the customer's homeowners insurance didn't cover the leak. paid out of pocket. appreciate this thread
    - author: blowerwheel_91
      body: |
        Apologies if this is basic. In Morris County a lot of houses still have oil. Is tank removal something HVAC companies do, or is it always a separate company? Thanks in advance.
    - author: haddad_mech
      body: |
        Mostly separate. On our commercial jobs it's always a sub with its own insurance for that work. Here's what I look for in that sub: their permits and paperwork, every time.
    - author: mbell_wireman
      body: |
        Electrical side note: the oil burner circuit and its emergency switch should be removed or properly reused during the conversion. I've seen dead burner switches left at the top of the stairs for decades confusing everybody. Label it or remove it.
    - author: plumbnj77
      body: |
        brother we pulled an "empty" one out of a basement in brick last month, bottom had a few inches of sludge. smelled for days. who even takes that stuff?
    - author: big_hector_plumb
      body: |
        talked to him today. basement tank is coming out, boss is pricing it. told him the yard one is a lawyer question. he actually listened lol. thier inspector already told them the same thing so that helped
    - author: rui_t_kearny
      body: |
        That's how you do it. My father used to say the customer remembers how you said it more than what you said.
    - author: TryingAllThree
      body: |
        We're in the middle of our own conversion and tank removal was in all three quotes. Reading this, I'm glad it was.

