style_rules:   # plan §5, applied by hand to the sample threads
  - inconsistent capitalization across users
  - typos <= 1 per 100 words, never in Senior answers about code
  - occasional "edit: thanks everyone"
  - quoting a previous reply
  - a reply that misreads the question
  - a Senior correcting another Senior politely
  - a Junior posting "update:" later
  - no marketing language, nobody praises Home Fixr
  - nobody writes in bullet points except S04 (Kash_sing)
  - thread bodies 40-250 words, replies 10-160 words, right-skewed
  - local texture in some posts (towns, roads, weather, housing stock, utilities, Wawa vs QuickChek)
  - facts about licensing/unions/schools hedged in character ("last I checked", "call the board/Local")
