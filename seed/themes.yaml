# ---------------------------------------------------------------------------
# Home Fixr Founding Community: conversation themes (plan §4/§5)
#
# Built from the plan's own §4 taxonomy plus general knowledge of how trades
# forums talk. NO Reddit (or any forum) text, usernames or images were fetched
# or stored for this file; the §5 "browse Reddit" research step was skipped on
# purpose. Because there is no reference corpus, the §8 plagiarism scan has
# nothing external to compare against; qa.py instead checks the generated
# content for internal near-duplicates (8-gram overlap between threads).
#
# Each topic: id, category (A–F), share of threads, typical framing (how the
# starter asks), typical pushback (what replies argue about), who usually
# answers, and fact_risk (claims that must be hedged in-character and listed
# for human verification).
# ---------------------------------------------------------------------------

target_threads: 190
target_replies: 1200
nyc_share: 0.10
reply_depth:            # share of threads by reply count
  zero: 0.08
  "2-5": 0.60
  "6-12": 0.30          # (plan: the 60/30/10 split covers threads that get replies)
  "13-25": 0.10
starter_mix: { junior: 0.85, senior: 0.15 }

categories:
  A: { name: "Getting in", share: 0.22 }
  B: { name: "Licensing & exams", share: 0.14 }
  C: { name: "On the job", share: 0.20 }
  D: { name: "Pay & business", share: 0.14 }
  E: { name: "Technical 'dumb questions'", share: 0.18 }
  F: { name: "Culture, venting, wins", share: 0.12 }

